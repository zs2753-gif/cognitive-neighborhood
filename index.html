<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cognitive District App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- PWA 配置文件与手机图标关联 -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="认知小区">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;800&display=swap');
    body { -webkit-tap-highlight-color: transparent; background-color: #f4efe6; font-family: 'Inter', sans-serif; }
    .font-handwritten { font-family: 'Caveat', cursive; }
    .floor-section { background: #fefcf8; border: 3px solid #78350f; box-shadow: 4px 6px 0px #78350f; transition: all 0.15s ease; }
    .modal-backdrop { background-color: rgba(69, 26, 3, 0.4); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="text-amber-950 pb-28 min-h-screen">

  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-40 bg-[#f4efe6]/90 backdrop-blur-md border-b-2 border-amber-900/20 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('towers')">
      <span class="text-2xl">🏡</span>
      <div>
        <h1 class="font-extrabold text-amber-950 text-base leading-none" id="app-title">Cognitive District</h1>
        <span class="text-[10px] font-bold text-amber-800/80" id="current-tower-badge">Active: None</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <div id="auth-header-btn"></div>
      <button id="lang-btn" onclick="toggleLanguage()" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-amber-800 text-amber-50 border border-amber-950 active:scale-95 transition">
        EN / 中
      </button>
    </div>
  </header>

  <!-- Auth Gateway Modal -->
  <div id="auth-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="w-full max-w-sm floor-section p-6 rounded-3xl space-y-4 bg-[#fefcf8]">
      <div class="flex justify-between items-center border-b border-amber-900/10 pb-2">
        <h2 id="auth-modal-title" class="text-lg font-black text-amber-950">🔑 登录 / 注册</h2>
        <button onclick="closeAuthModal()" class="text-amber-800 font-bold text-sm">✕</button>
      </div>
      
      <p id="auth-modal-desc" class="text-xs text-amber-900 font-bold leading-relaxed"></p>
      
      <div class="space-y-3 pt-1">
        <div>
          <label id="lbl-auth-username" class="text-xs font-black text-amber-900 block mb-1">账号/用户名</label>
          <input id="auth-username" type="text" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50/50 focus:outline-none">
        </div>
      </div>

      <div class="space-y-2 pt-2">
        <button id="btn-auth-submit" onclick="handleLogin()" class="w-full py-2.5 bg-amber-800 text-amber-50 rounded-xl text-xs font-black shadow-md hover:bg-amber-900 transition"></button>
        <button id="btn-auth-cancel" onclick="closeAuthModal()" class="w-full py-2 text-xs font-bold text-amber-800 border border-amber-300 rounded-xl"></button>
      </div>
    </div>
  </div>

  <!-- Main View -->
  <main class="max-w-md mx-auto p-4" id="main-container"></main>

  <!-- Bottom Nav -->
  <nav id="app-nav" class="fixed bottom-0 left-0 right-0 bg-[#fefcf8] border-t-2 border-amber-900 py-2 px-3 flex justify-around items-center z-40 max-w-md mx-auto shadow-2xl">
    <button onclick="switchTab('towers')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-800" id="nav-towers">
      <span class="text-xl">🏢</span><span class="nav-label" id="lbl-towers">Towers</span>
    </button>
    <button onclick="switchTab('locker')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-locker">
      <span class="text-xl">📦</span><span class="nav-label" id="lbl-locker">Locker</span>
    </button>
    <button onclick="switchTab('mystery')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-mystery">
      <span class="text-xl">❓</span><span class="nav-label" id="lbl-mystery">Mystery</span>
    </button>
    <button onclick="switchTab('garden')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-garden">
      <span class="text-xl">🌿</span><span class="nav-label" id="lbl-garden">Garden</span>
    </button>
    <button onclick="switchTab('archive')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-archive">
      <span class="text-xl">🗺️</span><span class="nav-label" id="lbl-archive">Archive</span>
    </button>
  </nav>

  <script>
    // ----------------------------------------------------
    // 已为你绑定的 Supabase 项目密钥
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://gjicktjcwp|twojesrzi.supabase.co'; //
    const SUPABASE_KEY = 'sb_publishable_5lwYFkpt_o-oRA815cA77w_3qAwTkha'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'towers';
    let currentUser = localStorage.getItem('cd_app_active_session_user') || null;
    let lang = localStorage.getItem('cd_app_lang') || 'en';
    let userData = null;

    const getInitialSeedData = () => ({
      selectedTowerId: null,
      towers: [
        {
          id: 'intl_student',
          icon: '🗽',
          zh: {
            name: '国际生适应大楼',
            slogan: '搞懂海外生活隐藏规则，避开消费与税收陷阱。',
            vision: '无缝融入留学生活，精细化管理日常花销。',
            floors: [
              { id: 'is_f3', num: 3, title: '消费税规避与避坑指南', icon: '🧾', desc: '掌握超市与餐车税收差异。', items: ['🚚 Food Truck (餐车)：标价即终价', '🎯 Target 类别差异：被子与拖把税率不同', '🍎 Appletree 超市：手工大曲奇要收税'] },
              { id: 'is_f2', num: 2, title: '租房与生活基础设施', icon: '🛋️', desc: '搞定住所，建立安全基底。', items: ['确认 Wi-Fi 宽带', '办理网银与 SSN / ITIN'] }
            ]
          },
          en: {
            name: 'Intl Student Adaptation System',
            slogan: 'Master hidden local rules and avoid tax traps.',
            vision: 'Seamless transition to study abroad life.',
            floors: [
              { id: 'is_f3', num: 3, title: 'Sales Tax & Shopping Rules', icon: '🧾', desc: 'Know tax differences across stores.', items: ['🚚 Food Truck: Listed price is final', '🎯 Target Rules: Tax on comforters differs from mops', '🍎 Appletree: Handmade giant cookies ARE taxable'] },
              { id: 'is_f2', num: 2, title: 'Housing & Utilities', icon: '🛋️', desc: 'Set up apartment and internet.', items: ['Activate Wi-Fi broadband', 'Setup local bank account'] }
            ]
          },
          expressLocker: [{ id: 'el_1', zh: 'Appletree 提醒：手工大曲奇要收税', en: 'Appletree Tip: Handmade giant cookies ARE taxable!' }],
          mysteryBox: [{ id: 'mb_1', q_zh: '为什么手工曲奇要收税？', q_en: 'Why are handmade cookies taxed?', a_zh: '属于加工即食食品。', a_en: 'Classified as prepared bakery goods.', isSolved: true }],
          garden: { who_zh: '初到海外的国际学生', who_en: 'International student', future_zh: '精明自律的生活达人', future_en: 'Savvy global citizen' }
        }
      ]
    });

    // Supabase 数据同步
    async function loadUserData() {
      if (currentUser) {
        try {
          const { data } = await supabaseClient
            .from('user_profiles')
            .select('*')
            .eq('user_id', currentUser)
            .single();

          if (data) {
            userData = data.towers_data;
            if (data.lang) lang = data.lang;
          } else {
            userData = getInitialSeedData();
            await saveData();
          }
        } catch (err) {
          userData = getInitialSeedData();
        }
      } else {
        userData = getInitialSeedData();
      }
      render();
    }

    async function saveData() {
      if (currentUser && userData) {
        try {
          await supabaseClient.from('user_profiles').upsert({
            user_id: currentUser,
            towers_data: userData,
            lang: lang
          });
        } catch (err) {
          console.error("Save error:", err);
        }
      }
      localStorage.setItem('cd_app_lang', lang);
    }

    async function handleLogin() {
      const uInput = document.getElementById('auth-username').value.trim();
      if (!uInput) return alert(lang === 'en' ? 'Please enter a username' : '请输入用户名');
      const cleanUser = uInput.replace(/\s+/g, '_');
      
      currentUser = cleanUser;
      localStorage.setItem('cd_app_active_session_user', currentUser);
      closeAuthModal();
      await loadUserData();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('cd_app_active_session_user');
      loadUserData();
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'zh' : 'en';
      saveData();
      render();
    }

    function getCurrentTower() {
      if (!userData || !userData.selectedTowerId) return null;
      return userData.towers.find(t => t.id === userData.selectedTowerId) || null;
    }

    function switchTab(tab, towerId = null) {
      currentTab = tab;
      if (towerId) { userData.selectedTowerId = towerId; saveData(); }
      render();
    }

    function render() {
      const authHeaderBtn = document.getElementById('auth-header-btn');
      authHeaderBtn.innerHTML = currentUser ? `
        <div class="flex items-center bg-amber-100 border border-amber-400 rounded-xl px-2.5 py-1 space-x-1.5 text-xs font-bold text-amber-900">
          <span>👤 ${currentUser.replace('_', ' ')}</span>
          <button onclick="logout()" class="text-[10px] text-rose-700 font-extrabold bg-rose-100 px-1.5 py-0.5 rounded">${lang === 'en' ? 'Exit' : '退出'}</button>
        </div>` : `
        <button onclick="openAuthModal()" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-amber-200 text-amber-950 border border-amber-400">
          ${lang === 'en' ? '🔑 Login / Sync' : '🔑 登录 / 云同步'}
        </button>`;

      document.getElementById('lbl-towers').innerText = lang === 'en' ? 'Towers' : '大楼';
      document.getElementById('lbl-locker').innerText = lang === 'en' ? 'Locker' : '快递柜';
      document.getElementById('lbl-mystery').innerText = lang === 'en' ? 'Mystery' : '问答箱';
      document.getElementById('lbl-garden').innerText = lang === 'en' ? 'Garden' : '花园';
      document.getElementById('lbl-archive').innerText = lang === 'en' ? 'Archive' : '全景';

      const container = document.getElementById('main-container');
      const currentTower = getCurrentTower();

      if (currentTab === 'towers') {
        container.innerHTML = `
          <div class="space-y-4">
            ${userData.towers.map(t => `
              <div class="floor-section p-4 rounded-2xl flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('tower_detail', '${t.id}')">
                  <span class="text-4xl">${t.icon}</span>
                  <div>
                    <h3 class="font-black text-amber-950 text-base">${t[lang].name}</h3>
                    <p class="text-xs text-amber-800/70">${t[lang].floors.length}${lang === 'en' ? 'Floors' : '层结构'}</p>
                  </div>
                </div>
                <button onclick="switchTab('tower_detail', '${t.id}')" class="text-xs bg-amber-800 text-amber-50 font-bold px-3 py-1.5 rounded-xl">
                  ${lang === 'en' ? 'Open' : '进入'} ➔
                </button>
              </div>`).join('')}
          </div>`;
      } else if (currentTab === 'tower_detail' && currentTower) {
        container.innerHTML = `<h2 class="text-xl font-black text-amber-950">${currentTower[lang].name}</h2>
          <p class="text-xs text-amber-900 mt-1">${currentTower[lang].slogan}</p>`;
      } else {
        container.innerHTML = `<div class="p-6 text-center text-xs font-bold text-amber-900">${lang === 'en' ? 'Select a tower first to manage its items.' : '请先进入大楼进行管理。'}</div>`;
      }
    }

    function openAuthModal() {
      const isEn = (lang === 'en');
      document.getElementById('auth-modal-title').innerText = isEn ? '🔑 Login / Register' : '🔑 登录 / 注册';
      document.getElementById('auth-modal-desc').innerText = isEn 
        ? 'Login to sync your data across devices seamlessly with Supabase Cloud.' 
        : '登录后，您的所有大楼与规则将自动同步至云端数据库，换手机数据不丢失。';
      document.getElementById('lbl-auth-username').innerText = isEn ? 'Username' : '账号/用户名';
      document.getElementById('auth-username').placeholder = isEn ? 'Enter username...' : '输入您的用户名...';
      document.getElementById('btn-auth-submit').innerText = isEn ? 'Login / Sync Cloud Data' : '登录 / 同步云端空间';
      document.getElementById('btn-auth-cancel').innerText = isEn ? 'Continue as Guest' : '暂不登录（继续浏览）';
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

    loadUserData();
  </script>
</body>
</html>
