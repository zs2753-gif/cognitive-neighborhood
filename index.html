<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cognitive District App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;800&display=swap');
    
    body { 
      -webkit-tap-highlight-color: transparent; 
      background-color: #f4efe6; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .font-handwritten { font-family: 'Caveat', cursive; }
    .floor-section {
      background: #fefcf8;
      border: 3px solid #78350f;
      box-shadow: 4px 6px 0px #78350f;
      transition: all 0.15s ease;
    }
    .modal-backdrop {
      background-color: rgba(69, 26, 3, 0.4);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="text-amber-950 pb-28 min-h-screen">
  <!-- Header with Language Switcher & Auth State -->
  <header id="app-header" class="sticky top-0 z-40 bg-[#f4efe6]/90 backdrop-blur-md border-b-2 border-amber-900/20 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('towers')">
      <span class="text-2xl">🏡</span>
      <div>
        <h1 class="font-extrabold text-amber-950 text-base leading-none" id="app-title">Cognitive District</h1>
        <span class="text-[10px] font-bold text-amber-800/80" id="current-tower-badge">Active: Intl Student</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- Auth Status Badge / Action Button -->
      <div id="auth-header-btn">
        <!-- Injected Dynamically -->
      </div>
      
      <!-- Language Toggle -->
      <button id="lang-btn" onclick="toggleLanguage()" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-amber-800 text-amber-50 border border-amber-950 active:scale-95 transition">
        EN / 中
      </button>
    </div>
  </header>

  <!-- Auth Gateway Modal / Overlay -->
  <div id="auth-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="w-full max-w-sm floor-section p-6 rounded-3xl space-y-4 bg-[#fefcf8]">
      <div class="flex justify-between items-center border-b border-amber-900/10 pb-2">
        <h2 class="text-lg font-black text-amber-950">🔑 登录 / 注册</h2>
        <button onclick="closeAuthModal()" class="text-amber-800 font-bold text-sm">✕</button>
      </div>
      
      <p class="text-xs text-amber-900 font-bold leading-relaxed">
        您正在尝试编辑或自定义大楼。请登录或创建账号，以便同步您的语言设置及专属数据。
      </p>
      
      <div class="space-y-3 pt-1">
        <div>
          <label class="text-xs font-black text-amber-900 block mb-1">账号/用户名</label>
          <input id="auth-username" type="text" placeholder="输入您的用户名..." class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50/50 focus:outline-none focus:ring-2 focus:ring-amber-700">
        </div>
        <div>
          <label class="text-xs font-black text-amber-900 block mb-1">密码</label>
          <input id="auth-password" type="password" placeholder="输入密码..." class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50/50 focus:outline-none focus:ring-2 focus:ring-amber-700">
        </div>
      </div>

      <div class="space-y-2 pt-2">
        <button onclick="handleLogin()" class="w-full py-2.5 bg-amber-800 text-amber-50 rounded-xl text-xs font-black shadow-md hover:bg-amber-900 transition">
          登录 / 存入我的专属空间
        </button>
        <button onclick="closeAuthModal()" class="w-full py-2 text-xs font-bold text-amber-800 border border-amber-300 rounded-xl">
          暂不登录（继续浏览）
        </button>
      </div>
    </div>
  </div>

  <!-- Main View Container -->
  <main class="max-w-md mx-auto p-4" id="main-container">
    <!-- Rendered dynamically via JS -->
  </main>

  <!-- Bottom Navigation -->
  <nav id="app-nav" class="fixed bottom-0 left-0 right-0 bg-[#fefcf8] border-t-2 border-amber-900 py-2 px-3 flex justify-around items-center z-40 max-w-md mx-auto shadow-2xl">
    <button onclick="switchTab('towers')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-800" id="nav-towers">
      <span class="text-xl">🏢</span><span class="nav-label" id="lbl-towers">Towers</span>
    </button>
    <button onclick="switchTab('locker')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-locker">
      <span class="text-xl">📦</span><span class="nav-label" id="lbl-locker">Locker</span>
    </button>
    <button onclick="switchTab('mystery')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-mystery">
      <span class="text-xl">❓</span><span class="nav-label" id="lbl-mystery">Mystery</span>
    </button>
    <button onclick="switchTab('garden')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-garden">
      <span class="text-xl">🌿</span><span class="nav-label" id="lbl-garden">Garden</span>
    </button>
    <button onclick="switchTab('archive')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-archive">
      <span class="text-xl">🗺️</span><span class="nav-label" id="lbl-archive">Archive</span>
    </button>
  </nav>

  <!-- General Modal Backdrop -->
  <div id="modal-overlay" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="bg-[#fefcf8] border-3 border-amber-900 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4" id="modal-content">
      <!-- Injected dynamically -->
    </div>
  </div>

  <script>

    let currentUser = localStorage.getItem('cd_app_active_session_user') || null;

    // 读取或初始化语言设置

          },
          en: {

            floors: [
              {

                num: 3,
                title: 'Recovery & Sleep Optimization',
                icon: '🌙',
                desc: 'Focus on muscle repair, relaxation, and circadian rhythm.',
                items: [
                  '😴 Secure 7-8 hours of quality deep sleep daily',
                  '🧘 15-min static stretching and foam rolling post-workout',
                  '📱 Cut screen time 1 hour before sleep for melatonin boost'
                ]
              },
              {
                id: 'ht_f2',
                num: 2,
                title: 'Strength Training & Cardio',
                icon: '💪',
                desc: 'Structured push-pull-legs splits paired with cardiovascular health.',
                items: [
                  '🏋️ 3-4 Strength workouts per week (Squat, Deadlift, Bench)',
                  '🏃 2 Low-intensity cardio sessions maintaining 120-140 bpm',
                  '📝 Progressive overload: Track weights and reps every session'
                ]
              },
              {
                id: 'ht_f1',
                num: 1,
                title: 'Nutrition Base & Hydration',
                icon: '🥗',
                desc: 'Manage macronutrients and hydration balance.',
                items: [
                  '🥩 Consume 1.6-2.0g protein per kg bodyweight daily',

                ]
              }
            ]
          },
          expressLocker: [
            { id: 'ht_el_1', zh: '训练前 30 分钟补充黑咖啡或碳水', en: 'Pre-workout: Black coffee/carb 30 mins prior' },
            { id: 'ht_el_2', zh: '蛋白粉冲服温度切勿过高', en: 'Whey Protein: Avoid hot water to prevent clumping' }
          ],
          mysteryBox: [
            { id: 'ht_mb_1', q_zh: '减脂期晚上饿了可以吃什么？', q_en: 'What can I eat when hungry late at night?', a_zh: '可以吃少许无糖脱脂黄瓜、蛋白霜或黄豆/水煮蛋白，避免高糖高碳水。', a_en: 'Egg whites, cucumber, or a scoop of casein protein with low carbs.', isSolved: true }
          ],
          garden: {
            who_zh: '追求身心健康与强健体魄的自律者',
            who_en: 'Fitness enthusiast building a strong body',

            future_en: 'High-energy, physically fit individual in total control'
          }
        }
      ]
    });

    let userData = null;

    function loadUserData() {
      if (currentUser) {
        // 同步登录用户的偏好语言
        const userSavedLang = localStorage.getItem(`cd_app_user_lang_${currentUser}`);
        if (userSavedLang) {
          lang = userSavedLang;
        }

        const key = `cd_app_isolated_data_${currentUser}`;
        const raw = localStorage.getItem(key);
        if (raw) {
          userData = JSON.parse(raw);
        } else {
          userData = getInitialSeedData();
          saveData();
        }
      } else {
        userData = getInitialSeedData();
      }
    }

    function saveData() {
      if (currentUser && userData) {
        localStorage.setItem(`cd_app_isolated_data_${currentUser}`, JSON.stringify(userData));
        localStorage.setItem(`cd_app_user_lang_${currentUser}`, lang);
      }
      localStorage.setItem('cd_app_lang', lang);
    }

    function requireAuth(actionCallback) {
      if (!currentUser) {
        openAuthModal();
      } else {
        actionCallback();
      }
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function handleLogin() {
      const uInput = document.getElementById('auth-username').value.trim();
      if (!uInput) return alert(lang === 'en' ? 'Please enter a username' : '请输入用户名');
      const cleanUser = uInput.replace(/\s+/g, '_');
      
      currentUser = cleanUser;
      localStorage.setItem('cd_app_active_session_user', currentUser);

      // 如果此账号以前保存过语言首选项，则同步载入，否则同步当前界面语言给新账号
      const userSavedLang = localStorage.getItem(`cd_app_user_lang_${currentUser}`);
      if (userSavedLang) {
        lang = userSavedLang;
      } else {
        localStorage.setItem(`cd_app_user_lang_${currentUser}`, lang);
      }

      loadUserData();
      closeAuthModal();
      render();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('cd_app_active_session_user');
      loadUserData();
      render();
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'zh' : 'en';
      saveData();
      render();
    }

    function getCurrentTower() {
      if (!userData) return null;
      let tower = userData.towers.find(t => t.id === userData.selectedTowerId);
      if (!tower && userData.towers.length > 0) {
        tower = userData.towers[0];
        userData.selectedTowerId = tower.id;
      }
      return tower;
    }

    function switchTab(tab, towerId = null) {
      currentTab = tab;
      if (towerId) {
        userData.selectedTowerId = towerId;
        saveData();
      }
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-800');
        btn.classList.add('text-amber-900/40');
      });
      const activeTabId = (tab === 'tower_detail') ? 'towers' : tab;
      const activeNav = document.getElementById(`nav-${activeTabId}`);
      if (activeNav) {
        activeNav.classList.remove('text-amber-900/40');
        activeNav.classList.add('text-amber-800');
      }
      render();
    }

    function render() {
      if (!userData) loadUserData();

      const authHeaderBtn = document.getElementById('auth-header-btn');
      if (currentUser) {
        authHeaderBtn.innerHTML = `
          <div class="flex items-center bg-amber-100 border border-amber-400/80 rounded-xl px-2.5 py-1 space-x-1.5 text-xs font-bold text-amber-900">
            <span>👤 ${currentUser.replace('_', ' ')}</span>
            <button onclick="logout()" class="text-[10px] text-rose-700 hover:text-rose-900 font-extrabold bg-rose-100 px-1.5 py-0.5 rounded">
              退出
            </button>
          </div>
        `;
      } else {
        authHeaderBtn.innerHTML = `
          <button onclick="openAuthModal()" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-amber-200 text-amber-950 border border-amber-400 hover:bg-amber-300 transition">
            🔑 登录 / 注册
          </button>
        `;
      }

      document.getElementById('lbl-towers').innerText = lang === 'en' ? 'Towers' : '大楼';
      document.getElementById('lbl-locker').innerText = lang === 'en' ? 'Locker' : '快递柜';
      document.getElementById('lbl-mystery').innerText = lang === 'en' ? 'Mystery' : '问答箱';
      document.getElementById('lbl-garden').innerText = lang === 'en' ? 'Garden' : '花园';
      document.getElementById('lbl-archive').innerText = lang === 'en' ? 'Archive' : '全景';
      document.getElementById('app-title').innerText = lang === 'en' ? 'Cognitive District' : '认知小区';
      
      const currentTower = getCurrentTower();
      const towerBadge = document.getElementById('current-tower-badge');
      if (currentTower) {
        towerBadge.innerText = (lang === 'en' ? 'Active: ' : '当前: ') + currentTower[lang].name;
      } else {
        towerBadge.innerText = lang === 'en' ? 'No Tower Selected' : '未选择大楼';
      }

      const container = document.getElementById('main-container');

      if (currentTab === 'towers') {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xs font-black text-amber-900/60 uppercase tracking-widest">
                ${lang === 'en' ? 'My Towers (Select to View)' : '大楼建筑群 (点击选择/进入)'}
              </h2>
            </div>
            ${userData.towers.map(t => {
              const data = t[lang];
              const isSelected = t.id === userData.selectedTowerId;
              return `
                <div class="floor-section p-4 rounded-2xl relative ${isSelected ? 'ring-2 ring-amber-700 bg-amber-50/70' : 'bg-[#fefcf8]'}">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer flex-1" onclick="selectAndOpenTower('${t.id}')">
                      <span class="text-4xl">${t.icon || '🏢'}</span>
                      <div>
                        <h3 class="font-black text-amber-950 text-base flex items-center gap-1.5">
                          ${data.name}${isSelected ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-800 text-amber-100">${lang === 'en' ? 'Active' : '当前'}</span>` : ''}
                        </h3>
                        <p class="text-xs text-amber-800/70 mt-0.5">${data.floors.length}${lang === 'en' ? 'Floors' : '层结构'}</p>
                      </div>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                      <button onclick="deleteTower(event, '${t.id}')" class="text-xs text-rose-700 bg-rose-100 hover:bg-rose-200 px-2.5 py-1 rounded-xl font-bold border border-rose-300">

      requireAuth(() => {
        if (confirm(lang === 'en' ? 'Delete this entire building?' : '确定要拆除整栋大楼吗？')) {
          userData.towers = userData.towers.filter(t => t.id !== towerId);

          render();

      const vision = document.getElementById('modal-input-vision').value.trim() || 'Achieve clarity and control';
      if (!name) return alert(lang === 'en' ? 'Please enter tower name' : '请输入大楼名称');
      const newId = 'tower_' + Date.now();
      userData.towers.push({
        id: newId,
        icon: '🏢',

          name, slogan, vision,
          floors: [{ id: newId + '_f1', num: 1, title: '基础地基层', icon: '📌', desc: '设定核心规则', items: ['示例规则'] }]

      closeModal();
      currentTab = 'tower_detail';
      render();

    }

    function submitAddItem(towerId, floorId) {
      const text = document.getElementById('modal-item-text').value.trim();
      if (!text) return;
      const tower = userData.towers.find(t => t.id === towerId);
      const fZh = tower.zh.floors.find(f => f.id === floorId);
      const fEn = tower.en.floors.find(f => f.id === floorId);
      if (fZh) fZh.items.push(text);
      if (fEn) fEn.items.push(text);
      saveData();
      closeModal();
      render();
    }

    function openEditItemModal(towerId, floorId, itemIdx) {
      requireAuth(() => {
        const tower = userData.towers.find(t => t.id === towerId);
        const floor = tower[lang].floors.find(f => f.id === floorId);
        showModal(`
          <h3 class="font-black text-amber-950 text-base">${lang === 'en' ? 'Edit Item' : '编辑条目'}</h3>
          <textarea id="modal-edit-item-text" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50 h-24">${floor.items[itemIdx]}</textarea>
          <div class="flex space-x-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 text-xs font-bold bg-amber-200 text-amber-900 rounded-xl border border-amber-400">${lang === 'en' ? 'Cancel' : '取消'}</button>
            <button onclick="submitEditItem('${towerId}', '${floorId}', ${itemIdx})" class="flex-1 py-2 text-xs font-bold bg-amber-800 text-amber-50 rounded-xl">${lang === 'en' ? 'Save' : '保存'}</button>
          </div>
        `);
      });
    }

    function submitEditItem(towerId, floorId, itemIdx) {
      const text = document.getElementById('modal-edit-item-text').value.trim();
      if (!text) return;
      const tower = userData.towers.find(t => t.id === towerId);
      const floor = tower[lang].floors.find(f => f.id === floorId);
      floor.items[itemIdx] = text;
      saveData();
      closeModal();
      render();
    }

    function deleteItem(towerId, floorId, itemIdx) {
      requireAuth(() => {
        const tower = userData.towers.find(t => t.id === towerId);
        const fZh = tower.zh.floors.find(f => f.id === floorId);
        const fEn = tower.en.floors.find(f => f.id === floorId);
        if (fZh && fZh.items) fZh.items.splice(itemIdx, 1);
        if (fEn && fEn.items) fEn.items.splice(itemIdx, 1);
        saveData();
        render();
      });
    }

    function openAddLockerModal() {
      requireAuth(() => {
        showModal(`
          <h3 class="font-black text-amber-950 text-base">${lang === 'en' ? 'Deposit Memo / Parcel' : '存入包裹/闪念卡'}</h3>
          <input id="modal-locker-input" type="text" placeholder="${lang === 'en' ? 'Note text...' : '输入备忘事项...'}" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50">
          <div class="flex space-x-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 text-xs font-bold bg-amber-200 text-amber-900 rounded-xl border border-amber-400">${lang === 'en' ? 'Cancel' : '取消'}</button>
            <button onclick="submitAddLocker()" class="flex-1 py-2 text-xs font-bold bg-amber-800 text-amber-50 rounded-xl">${lang === 'en' ? 'Deposit' : '存入'}</button>
          </div>
        `);
      });
    }

    function submitAddLocker() {
      const text = document.getElementById('modal-locker-input').value.trim();
      if (!text) return;
      const currentTower = getCurrentTower();
      if (!currentTower.expressLocker) currentTower.expressLocker = [];
      currentTower.expressLocker.push({ id: 'el_' + Date.now(), zh: text, en: text });
      saveData();
      closeModal();
      render();
    }

    function deleteLockerItem(id) {
      requireAuth(() => {
        const currentTower = getCurrentTower();
        currentTower.expressLocker = currentTower.expressLocker.filter(i => i.id !== id);
        saveData();
        render();
      });
    }

    function openAddMysteryModal() {
      requireAuth(() => {
        showModal(`
          <h3 class="font-black text-amber-950 text-base">${lang === 'en' ? 'Ask Mystery Question' : '提出本大楼新疑问'}</h3>
          <input id="modal-mystery-q" type="text" placeholder="${lang === 'en' ? 'Question text...' : '输入问题...'}" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50">
          <div class="flex space-x-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 text-xs font-bold bg-amber-200 text-amber-900 rounded-xl border border-amber-400">${lang === 'en' ? 'Cancel' : '取消'}</button>
            <button onclick="submitAddMystery()" class="flex-1 py-2 text-xs font-bold bg-amber-800 text-amber-50 rounded-xl">${lang === 'en' ? 'Submit' : '提交'}</button>
          </div>
        `);
      });
    }

    function submitAddMystery() {
      const q = document.getElementById('modal-mystery-q').value.trim();
      if (!q) return;
      const currentTower = getCurrentTower();
      if (!currentTower.mysteryBox) currentTower.mysteryBox = [];
      currentTower.mysteryBox.push({ id: 'mb_' + Date.now(), q_zh: q, q_en: q, a_zh: '', a_en: '', isSolved: false });
      saveData();
      closeModal();
      render();
    }

    function openSolveMysteryModal(id) {
      requireAuth(() => {
        showModal(`
          <h3 class="font-black text-amber-950 text-base">${lang === 'en' ? 'Solve Question' : '解答疑问'}</h3>
          <textarea id="modal-mystery-a" placeholder="${lang === 'en' ? 'Answer text...' : '输入解答心得...'}" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50 h-20"></textarea>
          <div class="flex space-x-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 text-xs font-bold bg-amber-200 text-amber-900 rounded-xl border border-amber-400">${lang === 'en' ? 'Cancel' : '取消'}</button>
            <button onclick="submitSolveMystery('${id}')" class="flex-1 py-2 text-xs font-bold bg-amber-800 text-amber-50 rounded-xl">${lang === 'en' ? 'Solve' : '保存解答'}</button>
          </div>
        `);
      });
    }

    function submitSolveMystery(id) {
      const ans = document.getElementById('modal-mystery-a').value.trim();
      if (!ans) return;
      const currentTower = getCurrentTower();
      const item = currentTower.mysteryBox.find(m => m.id === id);
      if (item) {
        item.a_zh = ans;
        item.a_en = ans;
        item.isSolved = true;
      }
      saveData();
      closeModal();
      render();
    }

    function deleteMysteryBox(id) {
      requireAuth(() => {
        const currentTower = getCurrentTower();
        currentTower.mysteryBox = currentTower.mysteryBox.filter(m => m.id !== id);
        saveData();
        render();
      });
    }

    function openEditGardenModal() {
      requireAuth(() => {
        const currentTower = getCurrentTower();
        const garden = currentTower.garden || { who_zh: '', who_en: '', future_zh: '', future_en: '' };
        showModal(`
          <h3 class="font-black text-amber-950 text-base">${lang === 'en' ? 'Edit Personal Vision' : '编辑个人愿景'}</h3>
          <input id="modal-garden-who" type="text" value="${lang === 'en' ? (garden.who_en || '') : (garden.who_zh || '')}" placeholder="${lang === 'en' ? 'Who You Are' : '当前身份'}" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50">
          <input id="modal-garden-future" type="text" value="${lang === 'en' ? (garden.future_en || '') : (garden.future_zh || '')}" placeholder="${lang === 'en' ? 'Future Self Goal' : '未来的我'}" class="w-full p-2.5 border-2 border-amber-900 rounded-xl text-xs font-bold bg-amber-50">
          <div class="flex space-x-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 text-xs font-bold bg-amber-200 text-amber-900 rounded-xl border border-amber-400">${lang === 'en' ? 'Cancel' : '取消'}</button>
            <button onclick="submitEditGarden()" class="flex-1 py-2 text-xs font-bold bg-amber-800 text-amber-50 rounded-xl">${lang === 'en' ? 'Save' : '保存'}</button>
          </div>
        `);
      });
    }

    function submitEditGarden() {
      const who = document.getElementById('modal-garden-who').value.trim();
      const future = document.getElementById('modal-garden-future').value.trim();
      const currentTower = getCurrentTower();
      currentTower.garden = {
        who_zh: who, who_en: who,
        future_zh: future, future_en: future
      };
      saveData();
      closeModal();
      render();
    }

    function showModal(contentHtml) {
      document.getElementById('modal-content').innerHTML = contentHtml;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    // Initialize App
    loadUserData();
    render();
  </script>
</body>
</html>
