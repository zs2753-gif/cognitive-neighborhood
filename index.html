<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>认知小区 Cognitive Neighborhood</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
    
    body { 
      -webkit-tap-highlight-color: transparent; 
      background-color: #f4efe6; 
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    
    .font-handwritten { font-family: 'Caveat', cursive, cursive; }

    /* 手绘插画风卡片与木质/墙体效果 */
    .house-roof {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .floor-section {
      background: #fefcf8;
      border: 3px solid #78350f;
      box-shadow: 4px 6px 0px #78350f;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .floor-section:active {
      transform: translateY(2px);
      box-shadow: 2px 3px 0px #78350f;
    }

    .gold-brick {
      background: #fef3c7;
      border: 2px dashed #d97706;
      color: #92400e;
    }
  </style>
</head>
<body class="text-amber-950 pb-24 min-h-screen">

  <!-- 顶栏与语言切换 -->
  <header class="sticky top-0 z-50 bg-[#f4efe6]/90 backdrop-blur-md border-b-2 border-amber-900/20 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏡</span>
      <h1 class="font-extrabold text-amber-950 text-lg" id="app-title">认知小区</h1>
    </div>
    <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1 text-xs font-bold rounded-full bg-amber-200 text-amber-900 border border-amber-400 active:scale-95 transition">
      EN / 中文
    </button>
  </header>

  <main class="max-w-md mx-auto p-4" id="main-container">
    <!-- 动态渲染区 -->
  </main>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#fefcf8] border-t-2 border-amber-900 py-2 px-3 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
    <button onclick="switchTab('towers')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-800" id="nav-towers">
      <span class="text-xl">🏢</span><span class="nav-label" data-zh="大楼" data-en="Towers">大楼</span>
    </button>
    <button onclick="switchTab('locker')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-locker">
      <span class="text-xl">📦</span><span class="nav-label" data-zh="快递柜" data-en="Locker">快递柜</span>
    </button>
    <button onclick="switchTab('mystery')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-mystery">
      <span class="text-xl">❓</span><span class="nav-label" data-zh="问答箱" data-en="Mystery">问答箱</span>
    </button>
    <button onclick="switchTab('garden')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-garden">
      <span class="text-xl">🌿</span><span class="nav-label" data-zh="花园" data-en="Garden">花园</span>
    </button>
    <button onclick="switchTab('archive')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-archive">
      <span class="text-xl">🗺️</span><span class="nav-label" data-zh="地图一览" data-en="Archive">地图一览</span>
    </button>
  </nav>

  <script>
    let lang = localStorage.getItem('cn_lang') || 'zh';
    let currentTab = 'towers';
    let selectedTowerId = null;

    let defaultData = {
      towers: [
        {
          id: 'body',
          name_zh: 'Health System',
          name_en: 'Health System',
          version: 'v1.2',
          vision_zh: '成为更健康、更有能量的自己。',
          vision_en: 'Become a healthier and more energetic self.',
          icon: '🏠',
          floors: [
            {
              id: 'f5',
              num: 5,
              title_zh: '心态与情绪',
              title_en: 'Mindset & Emotion',
              room_icon: '🧘‍♀️',
              desc_zh: '保持积极，学会调节压力，建立内在稳定性。',
              desc_en: 'Stay positive, regulate stress, build stability.',
              items: ['正念冥想', '情绪记录', '积极自我对话', '与支持的人交流'],
              fortified: true
            },
            {
              id: 'f4',
              num: 4,
              title_zh: '作息与睡眠',
              title_en: 'Sleep Habits',
              room_icon: '🌙',
              desc_zh: '规律作息，保证充足睡眠，让身体充分恢复。',
              desc_en: 'Keep regular sleep to restore mind and body.',
              items: ['固定睡眠时间', '睡前放松', '减少屏幕时间', '保证7-8小时睡眠'],
              fortified: true
            },
            {
              id: 'f3',
              num: 3,
              title_zh: '运动习惯',
              title_en: 'Workout Habits',
              room_icon: '🏃',
              desc_zh: '增强体能，提升耐力，让身体更有活力。',
              desc_en: 'Build endurance and stay energetic.',
              items: ['每周3-5次运动', '力量训练', '有氧运动', '拉伸放松'],
              fortified: false
            },
            {
              id: 'f2',
              num: 2,
              title_zh: '生活方式',
              title_en: 'Lifestyle Management',
              room_icon: '📖',
              desc_zh: '提升专注力，管理时间，建立高效习惯。',
              desc_en: 'Improve focus, manage time efficiently.',
              items: ['时间管理', '减少拖延', '专注工作学习', '保持好奇心'],
              fortified: false
            },
            {
              id: 'f1',
              num: 1,
              title_zh: '饮食习惯',
              title_en: 'Diet System',
              room_icon: '🥗',
              desc_zh: '营养均衡，控制热量，为身体提供能量。',
              desc_en: 'Balanced nutrition and steady energy.',
              items: ['低碳饮食', '先吃蔬菜', '高蛋白摄入', '多喝水', '少糖少油'],
              fortified: true
            }
          ]
        }
      ],
      expressLocker: [
        { id: 'e1', text_zh: '先吃蔬菜再吃蛋白质，血糖更稳定', text_en: 'Eat veggies before protein for steady blood sugar' }
      ],
      mysteryBox: [
        { id: 'm1', q_zh: '下午3点总是犯困怎么办？', q_en: 'How to tackle 3 PM fatigue?', a_zh: '午餐减少精制碳水，增加蛋白质与20分钟散步。', a_en: 'Reduce refined carbs at lunch and take a 20-min walk.', isSolved: true }
      ],
      garden: {
        whoIAm_zh: '坚持 Health System 运行 45 天的系统构建者',
        whoIAm_en: 'Health System Builder - 45 Day Streak',
        future_zh: '拥有极佳精力与稳定情绪的健康个体',
        future_en: 'A person with boundless energy and emotional balance'
      }
    };

    let appData = JSON.parse(localStorage.getItem('cn_app_data')) || defaultData;

    function saveData() {
      localStorage.setItem('cn_app_data', JSON.stringify(appData));
      localStorage.setItem('cn_lang', lang);
    }

    function toggleLanguage() {
      lang = lang === 'zh' ? 'en' : 'zh';
      saveData();
      render();
    }

    function switchTab(tab, towerId = null) {
      currentTab = tab;
      if (towerId) selectedTowerId = towerId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-800');
        btn.classList.add('text-amber-900/40');
      });
      const activeNav = document.getElementById(`nav-${tab === 'tower_detail' ? 'towers' : tab}`);
      if (activeNav) {
        activeNav.classList.remove('text-amber-900/40');
        activeNav.classList.add('text-amber-800');
      }
      render();
    }

    function render() {
      document.querySelectorAll('.nav-label').forEach(el => {
        el.innerText = el.getAttribute(`data-${lang}`);
      });
      document.getElementById('app-title').innerText = lang === 'zh' ? '认知小区' : 'Cognitive District';

      const container = document.getElementById('main-container');

      if (currentTab === 'towers') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xs font-black text-amber-900/60 uppercase tracking-widest">${lang === 'zh' ? '我的建筑群 (Dollhouse View)' : 'My Dollhouses'}</h2>
            ${appData.towers.map(t => `
              <div onclick="switchTab('tower_detail', '${t.id}')" class="floor-section p-5 rounded-2xl flex items-center justify-between cursor-pointer">
                <div class="flex items-center space-x-4">
                  <span class="text-4xl">${t.icon}</span>
                  <div>
                    <h3 class="font-black text-amber-950 text-lg">${t.name_zh} <span class="text-xs font-normal text-amber-700">${t.version}</span></h3>
                    <p class="text-xs text-amber-800/70 mt-1">${t.floors.length}${lang === 'zh' ? '层剖面结构大楼' : 'Floors Structure'}</p>
                  </div>
                </div>
                <span class="text-amber-900 font-extrabold text-xl">➔</span>
              </div>
            `).join('')}
            
            <button onclick="addNewTower()" class="w-full py-4 border-2 border-dashed border-amber-800/40 text-amber-900 rounded-2xl font-black text-sm flex items-center justify-center space-x-2 bg-amber-100/50 active:bg-amber-200 transition">
              <span class="text-xl">+</span><span>${lang === 'zh' ? '设计新剖面大楼' : 'Design New Dollhouse'}</span>
            </button>
          </div>
        `;
      } else if (currentTab === 'tower_detail') {
        const tower = appData.towers.find(t => t.id === selectedTowerId);
        container.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-4">
              <button onclick="switchTab('towers')" class="text-xs text-amber-900 font-bold bg-amber-200/60 px-3 py-1.5 rounded-xl border border-amber-800/30">
                ← ${lang === 'zh' ? '返回建筑群' : 'District Map'}
              </button>
              <button onclick="addNewFloor('${tower.id}')" class="text-xs bg-amber-800 text-amber-50 font-bold px-3 py-1.5 rounded-xl border border-amber-950 shadow">
                + ${lang === 'zh' ? '加盖顶楼新层' : 'Build Upper Floor'}
              </button>
            </div>

            <!-- 屋顶与愿景看板 -->
            <div class="bg-amber-100 border-3 border-amber-900 p-4 rounded-3xl mb-4 text-center relative shadow-md">
              <div class="font-handwritten text-2xl text-amber-900 font-bold">Small habits build a big life.</div>
              <h2 class="text-xl font-black text-amber-950 mt-1">${tower.name_zh} <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-200">${tower.version}</span></h2>
              <p class="text-xs text-amber-800 mt-2 font-medium">🎯 Vision: ${lang === 'zh' ? tower.vision_zh : tower.vision_en}</p>
            </div>

            <!-- 剖面大楼直观展示区 -->
            <div class="space-y-4">
              ${tower.floors.map(f => `
                <div class="floor-section rounded-2xl p-4 relative">
                  
                  <!-- 楼层标题头 -->
                  <div class="flex justify-between items-center border-b border-amber-900/10 pb-2 mb-3">
                    <div class="flex items-center space-x-2">
                      <span class="text-2xl">${f.room_icon || '🏠'}</span>
                      <h3 class="font-black text-amber-950 text-base">${f.num}.${lang === 'zh' ? f.title_zh : f.title_en}</h3>
                    </div>
                    ${f.fortified ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full gold-brick">🏆 ${lang === 'zh' ? '金砖强化层' : 'Fortified'}</span>` : ''}
                  </div>

                  <!-- 左右剖面结构：左侧理念，右侧具体行动Checklist -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-900/10">
                      <p class="text-xs text-amber-900/80 font-medium leading-relaxed">${lang === 'zh' ? f.desc_zh : f.desc_en}</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-amber-900/20 space-y-1">
                      <span class="text-[10px] font-black text-amber-800 uppercase tracking-wider block mb-1">Checklist / SOP:</span>
                      ${f.items.map(item => `
                        <div class="flex items-center space-x-1.5 text-xs text-amber-950 font-medium">
                          <span class="text-amber-600 font-bold">✓</span>
                          <span>${item}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <!-- 交互按钮：加固楼层 -->
                  <button onclick="fortifyFloor('${tower.id}', '${f.id}')" class="w-full mt-3 py-1.5 text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold rounded-xl border border-amber-900/30 transition">
                    🧱 ${lang === 'zh' ? '注入感悟 / 增加 Checklist 贴砖加固' : 'Reinforce / Add Check Item'}
                  </button>
                </div>
              `).join('')}
            </div>

            <!-- 地基看板 -->
            <div class="mt-4 p-4 bg-amber-900 text-amber-100 rounded-2xl text-center shadow-lg">
              <p class="font-handwritten text-xl">Better Me →</p>
              <p class="text-xs font-bold text-amber-200 mt-1">${lang === 'zh' ? '健康不是终点，而是一种生活方式。' : 'Health is not a destination, it is a lifestyle.'}</p>
            </div>
          </div>
        `;
      } else if (currentTab === 'locker') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">📦 ${lang === 'zh' ? '即时快递柜' : 'Express Locker'}</h2>
            <div class="space-y-3">
              ${appData.expressLocker.map(item => `
                <div class="floor-section p-4 rounded-2xl text-xs text-amber-900 flex justify-between items-center">
                  <span>${lang === 'zh' ? item.text_zh : item.text_en}</span>
                  <button onclick="claimLocker()" class="text-xs bg-amber-800 text-amber-50 px-2.5 py-1 rounded-lg font-bold ml-2">${lang === 'zh' ? '砌入大楼' : 'Attach'}</button>
                </div>
              `).join('')}
            </div>
            <button onclick="addLockerItem()" class="w-full py-3 bg-amber-800 text-amber-50 rounded-2xl text-xs font-bold shadow active:scale-95 transition">
              + ${lang === 'zh' ? '存入闪念包裹' : 'Deposit Thought'}
            </button>
          </div>
        `;
      } else if (currentTab === 'mystery') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">❓ ${lang === 'zh' ? '问答施工箱' : 'Mystery Box'}</h2>
            <div class="space-y-3">
              ${appData.mysteryBox.map(m => `
                <div class="floor-section p-4 rounded-2xl space-y-2">
                  <p class="text-xs font-black text-amber-900">Q: ${lang === 'zh' ? m.q_zh : m.q_en}</p>
                  ${m.isSolved ? `
                    <div class="p-3 bg-emerald-50 border border-emerald-300 rounded-xl text-xs text-emerald-900">
                      <strong>A:</strong> ${lang === 'zh' ? m.a_zh : m.a_en}
                    </div>
                  ` : `
                    <button onclick="solveMystery('${m.id}')" class="text-xs bg-amber-200 text-amber-900 px-3 py-1.5 rounded-lg font-bold">${lang === 'zh' ? '破解解惑转换为金砖 →' : 'Solve & Get Brick →'}</button>
                  `}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentTab === 'garden') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">🌿 ${lang === 'zh' ? '身份愿景花园' : 'Personal Garden'}</h2>
            <div class="bg-gradient-to-br from-amber-800 to-amber-950 p-6 rounded-3xl text-amber-50 space-y-5 shadow-2xl">
              <div>
                <span class="text-xs font-black opacity-75 uppercase tracking-wider">Who You Are</span>
                <p class="font-extrabold text-base mt-1">${lang === 'zh' ? appData.garden.whoIAm_zh : appData.garden.whoIAm_en}</p>
              </div>
              <div class="border-t border-amber-700/50 pt-4">
                <span class="text-xs font-black opacity-75 uppercase tracking-wider">Future Self</span>
                <p class="font-extrabold text-base mt-1">${lang === 'zh' ? appData.garden.future_zh : appData.garden.future_en}</p>
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'archive') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">🗺️ ${lang === 'zh' ? 'Archive 地图一览' : 'Master Archive'}</h2>
            <div class="grid grid-cols-2 gap-3">
              <div class="floor-section p-4 rounded-2xl text-center">
                <div class="text-3xl font-black text-amber-800">${appData.towers.length}</div>
                <div class="text-xs text-amber-900/70 mt-1">${lang === 'zh' ? '总系统大楼' : 'Total Systems'}</div>
              </div>
              <div class="floor-section p-4 rounded-2xl text-center">
                <div class="text-3xl font-black text-amber-600">${appData.mysteryBox.filter(m => m.isSolved).length}</div>
                <div class="text-xs text-amber-900/70 mt-1">${lang === 'zh' ? '已攻克困惑' : 'Solved Mysteries'}</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function addNewFloor(towerId) {
      const title = prompt(lang === 'zh' ? '请输入新楼层名称（如：心态调节）：' : 'Enter floor title:');
      if (title) {
        const desc = prompt(lang === 'zh' ? '请输入本层的核心理念描述：' : 'Enter floor description:') || '';
        const tower = appData.towers.find(t => t.id === towerId);
        tower.floors.unshift({
          id: Date.now().toString(),
          num: tower.floors.length + 1,
          title_zh: title,
          title_en: title,
          room_icon: '🪴',
          desc_zh: desc,
          desc_en: desc,
          items: [lang === 'zh' ? '初始建楼 SOP 准则' : 'Initial Rule'],
          fortified: false
        });
        saveData();
        render();
      }
    }

    function fortifyFloor(towerId, floorId) {
      const item = prompt(lang === 'zh' ? '请输入一条要加固填入的具体 Checklist 细则：' : 'Enter a new checklist item:');
      if (item) {
        const tower = appData.towers.find(t => t.id === towerId);
        const floor = tower.floors.find(f => f.id === floorId);
        floor.items.push(item);
        floor.fortified = true;
        saveData();
        render();
      }
    }

    function addLockerItem() {
      const input = prompt(lang === 'zh' ? '存入一条闪念/包裹：' : 'Deposit thought:');
      if (input) {
        appData.expressLocker.push({ id: Date.now().toString(), text_zh: input, text_en: input });
        saveData();
        render();
      }
    }

    function claimLocker() {
      alert(lang === 'zh' ? '请前往具体剖面大楼，在对应楼层点击“加固”将其砌入 Checklist！' : 'Go to dollhouse and click reinforce!');
    }

    function solveMystery(id) {
      const item = appData.mysteryBox.find(m => m.id === id);
      const ans = prompt(lang === 'zh' ? '请输入答案与破解心得：' : 'Enter solution:');
      if (ans) {
        item.a_zh = ans;
        item.a_en = ans;
        item.isSolved = true;
        saveData();
        render();
      }
    }

    function addNewTower() {
      const name = prompt(lang === 'zh' ? '请输入新剖面大楼名称（如：Finance System）：' : 'Enter new dollhouse name:');
      if (name) {
        appData.towers.push({
          id: Date.now().toString(),
          name_zh: name,
          name_en: name,
          version: 'v1.0',
          vision_zh: '掌控核心资产与复利逻辑',
          vision_en: 'Mastering core assets and compounding',
          icon: '🏦',
          floors: [{
            id: Date.now().toString(),
            num: 1,
            title_zh: '地基与预算',
            title_en: 'Base & Budget',
            room_icon: '💰',
            desc_zh: '控制现金流与应急准备金。',
            desc_en: 'Control cashflow and emergency fund.',
            items: ['预留6个月准备金'],
            fortified: false
          }]
        });
        saveData();
        render();
      }
    }

    render();
  </script>
</body>
</html>
