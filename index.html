<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>认知小区 Cognitive District</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
    
    body { 
      -webkit-tap-highlight-color: transparent; 
      background-color: #f4efe6; 
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    
    .font-handwritten { font-family: 'Caveat', cursive; }

    /* 手绘插画风卡片与墙体效果 */
    .floor-section {
      background: #fefcf8;
      border: 3px solid #78350f;
      box-shadow: 4px 6px 0px #78350f;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .gold-brick {
      background: #fef3c7;
      border: 1.5px dashed #d97706;
      color: #92400e;
    }
  </style>
</head>
<body class="text-amber-950 pb-24 min-h-screen">

  <!-- 顶栏与单语/切换 -->
  <header class="sticky top-0 z-50 bg-[#f4efe6]/90 backdrop-blur-md border-b-2 border-amber-900/20 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('towers')">
      <span class="text-2xl">🏡</span>
      <h1 class="font-extrabold text-amber-950 text-lg" id="app-title">认知小区</h1>
    </div>
    <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1 text-xs font-bold rounded-full bg-amber-200 text-amber-900 border border-amber-400 active:scale-95 transition">
      切换语言 / Language
    </button>
  </header>

  <main class="max-w-md mx-auto p-4" id="main-container">
    <!-- 动态渲染区 -->
  </main>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#fefcf8] border-t-2 border-amber-900 py-2 px-3 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
    <button onclick="switchTab('towers')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-800" id="nav-towers">
      <span class="text-xl">🏢</span><span class="nav-label" id="lbl-towers">大楼</span>
    </button>
    <button onclick="switchTab('locker')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-locker">
      <span class="text-xl">📦</span><span class="nav-label" id="lbl-locker">快递柜</span>
    </button>
    <button onclick="switchTab('mystery')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-mystery">
      <span class="text-xl">❓</span><span class="nav-label" id="lbl-mystery">问答箱</span>
    </button>
    <button onclick="switchTab('garden')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-garden">
      <span class="text-xl">🌿</span><span class="nav-label" id="lbl-garden">花园</span>
    </button>
    <button onclick="switchTab('archive')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-archive">
      <span class="text-xl">🗺️</span><span class="nav-label" id="lbl-archive">全景</span>
    </button>
  </nav>

  <script>
    let lang = localStorage.getItem('cn_lang') || 'zh';
    let currentTab = 'towers';
    let selectedTowerId = 'intl_student';

    // 默认数据库（包含国际生大楼与健康大楼）
    let defaultData = {
      towers: [

            footerText: '懂规则，才能在海外生活得从容自如。',
            floors: [
              {
                id: 'is_f3',

                desc: '搞定住所，建立安全的日常生活基底。',
                items: ['确认 Wi-Fi 宽带开通', '办理网银与 SSN/ITIN', '购买租客保险'],

              {

                items: [
                  '🚚 Food Truck: Listed price is usually final price without extra added tax',

                  '👕 Clothing Tax: Rates vary by total item price threshold',

                  '🛍️ Trader Joe\'s: Sales tax calculated at checkout for prepared food & supplies'
                ],
                fortified: true
              },
              {
                id: 'is_f2',
                num: 2,

                icon: '🛋️',

                fortified: false
              },
              {
                id: 'is_f1',
                num: 1,
                title: 'Legal Status Base',

                desc: 'Maintain legal student status and insurance.',

                fortified: true
              }
            ]
          }
        },
        {
          id: 'body',
          icon: '🏠',
          version: 'v1.2',
          zh: {
            name: '健康管理大楼',
            slogan: '细微习惯，构建宏大人生。',
            vision: '成为更健康、更有能量的自己。',
            footerText: '健康不是终点，而是一种生活方式。',
            floors: [
              {

                num: 5,
                title: '心态与情绪',

                fortified: true
              },
              {
                id: 'f4',
                num: 4,
                title: '作息与睡眠',
                icon: '🌙',
                desc: '规律作息，保证充足睡眠，让身体充分恢复。',
                items: ['固定睡眠时间', '睡前放松', '减少屏幕时间', '保证 7-8 小时睡眠'],
                fortified: true
              },
              {
                id: 'f3',
                num: 3,
                title: '运动习惯',
                icon: '🏃',
                desc: '增强体能，提升耐力，让身体更有活力。',
                items: ['每周 3-5 次运动', '力量训练', '有氧运动', '拉伸放松'],
                fortified: false
              },
              {
                id: 'f2',
                num: 2,
                title: '生活方式',
                icon: '📖',
                desc: '提升专注力，管理时间，建立高效日常节奏。',
                items: ['时间管理', '减少拖延', '专注工作学习', '保持好奇心'],
                fortified: false
              },
              {
                id: 'f1',
                num: 1,
                title: '饮食习惯',
                icon: '🥗',
                desc: '营养均衡，控制热量，为身体提供稳定能量。',
                items: ['低碳饮食', '先吃蔬菜', '高蛋白摄入', '多喝水', '少糖少油'],
                fortified: true
              }
            ]
          },
          en: {
            name: 'Health System',
            slogan: 'Small habits build a big life.',
            vision: 'Become a healthier, more energetic self.',
            footerText: 'Health is not a destination, but a lifestyle.',
            floors: [
              {
                id: 'f5',
                num: 5,
                title: 'Mindset & Emotion',
                icon: '🧘‍♀️️',
                desc: 'Stay positive, regulate stress, build stability.',
                items: ['Mindfulness', 'Mood log', 'Positive self-talk', 'Connect with allies'],
                fortified: true
              },
              {
                id: 'f4',
                num: 4,
                title: 'Sleep Habits',
                icon: '🌙',
                desc: 'Keep regular sleep to restore mind and body.',
                items: ['Fixed sleep schedule', 'Bedtime relaxation', 'Reduce screen time', '7-8 hours sleep'],
                fortified: true
              },
              {
                id: 'f3',
                num: 3,
                title: 'Workout Habits',
                icon: '🏃',
                desc: 'Build endurance and stay energetic.',
                items: ['3-5 workouts/week', 'Strength training', 'Cardio', 'Stretching'],
                fortified: false
              },
              {
                id: 'f2',
                num: 2,
                title: 'Lifestyle Management',
                icon: '📖',
                desc: 'Improve focus, manage time efficiently.',
                items: ['Time management', 'Reduce procrastination', 'Deep focus', 'Stay curious'],
                fortified: false
              },
              {
                id: 'f1',
                num: 1,
                title: 'Diet System',
                icon: '🥗',
                desc: 'Balanced nutrition and steady energy.',
                items: ['Low carb', 'Veggies first', 'High protein', 'Drink water', 'Low sugar & oil'],
                fortified: true
              }
            ]
          }
        }
      ],
      expressLocker: [
        { id: 'e1', zh: 'Target 买冷冻原味蔬菜免税，微波炉热食要算税', en: 'Raw frozen veggies at Target are tax exempt; hot foods taxable' }
      ],
      mysteryBox: [
        { id: 'm1', q_zh: 'Appletree 的大曲奇算手工加工食品吗？', q_en: 'Are giant cookies at Appletree prepared food?', a_zh: '是的，店内现场烘焙/包装的手工制品（如曲奇、Hero 三明治）均会被计入消费税。', a_en: 'Yes, fresh baked items & hero sandwiches are subject to prepared food sales tax.', isSolved: true }
      ],
      garden: {
        who_zh: '正在建立留学独立生活规则的国际生',
        who_en: 'Intl Student mastering local living rules',
        future_zh: '精明自律、从容驾驭海外生活的自理达人',
        future_en: 'A confident, independent global citizen'
      }
    };

    let appData = JSON.parse(localStorage.getItem('cn_app_data_v3')) || defaultData;

    function saveData() {
      localStorage.setItem('cn_app_data_v3', JSON.stringify(appData));
      localStorage.setItem('cn_lang', lang);
    }

    function toggleLanguage() {
      lang = lang === 'zh' ? 'en' : 'zh';
      saveData();
      render();
    }

    function switchTab(tab, towerId = null) {
      currentTab = tab;
      if (towerId) selectedTowerId = towerId;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-800');
        btn.classList.add('text-amber-900/40');
      });
      const activeTabId = (tab === 'tower_detail') ? 'towers' : tab;
      const activeNav = document.getElementById(`nav-${activeTabId}`);
      if (activeNav) {
        activeNav.classList.remove('text-amber-900/40');
        activeNav.classList.add('text-amber-800');
      }
      render();
    }

    function render() {
      document.getElementById('lbl-towers').innerText = lang === 'zh' ? '大楼' : 'Towers';
      document.getElementById('lbl-locker').innerText = lang === 'zh' ? '快递柜' : 'Locker';
      document.getElementById('lbl-mystery').innerText = lang === 'zh' ? '问答箱' : 'Mystery';
      document.getElementById('lbl-garden').innerText = lang === 'zh' ? '花园' : 'Garden';
      document.getElementById('lbl-archive').innerText = lang === 'zh' ? '全景' : 'Archive';
      document.getElementById('app-title').innerText = lang === 'zh' ? '认知小区' : 'Cognitive District';

      const container = document.getElementById('main-container');

      // 页面 1：大楼列表
      if (currentTab === 'towers') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xs font-black text-amber-900/60 uppercase tracking-widest">
              ${lang === 'zh' ? '我的剖面建筑群（点击进入）' : 'My Dollhouses (Click to enter)'}
            </h2>

            ${appData.towers.map(t => {
              const data = t[lang];
              return `
                <div onclick="openTower('${t.id}')" class="floor-section p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-amber-50">
                  <div class="flex items-center space-x-4">
                    <span class="text-4xl">${t.icon}</span>
                    <div>
                      <h3 class="font-black text-amber-950 text-lg flex items-center gap-2">
                        ${data.name} 
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900">${t.version}</span>
                      </h3>
                      <p class="text-xs text-amber-800/70 mt-1">${data.floors.length}${lang === 'zh' ? '层剖面房间结构' : 'Floors Structure'}</p>
                    </div>
                  </div>
                  <span class="text-amber-900 font-extrabold text-xl">➔</span>
                </div>
              `;
            }).join('')}

            <button onclick="addNewTower()" class="w-full py-4 border-2 border-dashed border-amber-800/40 text-amber-900 rounded-2xl font-black text-sm flex items-center justify-center space-x-2 bg-amber-100/50 active:bg-amber-200 transition">
              <span class="text-xl">+</span>
              <span>${lang === 'zh' ? '设计新大楼' : 'Design New Building'}</span>
            </button>
          </div>
        `;
      } 
      // 页面 2：剖面大楼详情视图
      else if (currentTab === 'tower_detail') {
        const tower = appData.towers.find(t => t.id === selectedTowerId);
        if (!tower) { switchTab('towers'); return; }
        const data = tower[lang];

        container.innerHTML = `
          <div>
            <!-- 操作顶栏 -->
            <div class="flex justify-between items-center mb-4">
              <button onclick="switchTab('towers')" class="text-xs text-amber-900 font-bold bg-amber-200/80 px-3 py-1.5 rounded-xl border border-amber-800/30">
                ← ${lang === 'zh' ? '返回建筑群' : 'District Map'}
              </button>
              <button onclick="addNewFloor('${tower.id}')" class="text-xs bg-amber-800 text-amber-50 font-bold px-3 py-1.5 rounded-xl border border-amber-950 shadow">
                + ${lang === 'zh' ? '加盖顶楼新层' : 'Build Upper Floor'}
              </button>
            </div>

            <!-- 屋顶与愿景看板 -->
            <div class="bg-amber-100 border-3 border-amber-900 p-5 rounded-3xl mb-5 text-center relative shadow-md">
              <div class="font-handwritten text-2xl text-amber-900 font-bold">${data.slogan}</div>
              <h2 class="text-2xl font-black text-amber-950 mt-1">${data.name} <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-300">${tower.version}</span></h2>
              <p class="text-xs text-amber-900 mt-2 font-bold bg-amber-200/60 py-1 px-3 rounded-lg inline-block">
                🎯 ${lang === 'zh' ? '愿景' : 'Vision'}: ${data.vision}
              </p>
            </div>

            <!-- 垂直剖面房间展厅 -->
            <div class="space-y-4">
              ${data.floors.map(f => `
                <div class="floor-section rounded-2xl p-4 relative">
                  
                  <!-- 楼层卡片头部（含删除按钮） -->
                  <div class="flex justify-between items-center border-b border-amber-900/10 pb-2 mb-3">
                    <div class="flex items-center space-x-2">
                      <span class="text-2xl">${f.icon || '🏠'}</span>
                      <h3 class="font-black text-amber-950 text-base">${f.num}.${f.title}</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                      ${f.fortified ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full gold-brick">🏆 ${lang === 'zh' ? '已加固' : 'Fortified'}</span>` : ''}
                      <button onclick="deleteFloor('${tower.id}', '${f.id}')" class="text-xs text-rose-700 bg-rose-100 hover:bg-rose-200 px-2 py-0.5 rounded-lg font-bold border border-rose-300">
                        🗑️ ${lang === 'zh' ? '删除' : 'Del'}
                      </button>
                    </div>
                  </div>

                  <!-- 左右剖面：理念与清单 -->
                  <div class="space-y-2">
                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-900/10">
                      <p class="text-xs text-amber-900 font-medium leading-relaxed">${f.desc}</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-amber-900/20 space-y-1.5">
                      <span class="text-[10px] font-black text-amber-800 uppercase tracking-wider block">${lang === 'zh' ? '行动清单 / 税收法条' : 'Checklist / Tax Rules'}:</span>
                      ${f.items.map((item, idx) => `
                        <div class="flex items-start space-x-2 text-xs text-amber-950 font-semibold leading-relaxed">
                          <span class="text-amber-600 font-bold mt-0.5">✓</span>
                          <span>${item}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <!-- 加固按钮 -->
                  <button onclick="fortifyFloor('${tower.id}', '${f.id}')" class="w-full mt-3 py-2 text-xs bg-amber-100 hover:bg-amber-200 text-amber-950 font-black rounded-xl border border-amber-900/30 transition">
                    🧱 ${lang === 'zh' ? '新增贴砖 / 加固本层' : 'Add Check Item / Reinforce'}
                  </button>
                </div>
              `).join('')}
            </div>

            <!-- 地基看板 -->
            <div class="mt-5 p-4 bg-amber-900 text-amber-100 rounded-2xl text-center shadow-lg">
              <p class="font-handwritten text-xl">Better Me →</p>
              <p class="text-xs font-bold text-amber-200 mt-1">${data.footerText}</p>
            </div>
          </div>
        `;
      } else if (currentTab === 'locker') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">📦 ${lang === 'zh' ? '即时快递柜' : 'Express Locker'}</h2>
            <div class="space-y-3">
              ${appData.expressLocker.map(item => `
                <div class="floor-section p-4 rounded-2xl text-xs text-amber-900 flex justify-between items-center">
                  <span>${lang === 'zh' ? item.zh : item.en}</span>
                  <button onclick="alert('${lang === 'zh' ? '请进入大楼后点击【新增贴砖】将其加入清单！' : 'Open room detail to attach!'}')" class="text-xs bg-amber-800 text-amber-50 px-3 py-1 rounded-lg font-bold ml-2">${lang === 'zh' ? '砌入大楼' : 'Attach'}</button>
                </div>
              `).join('')}
            </div>
            <button onclick="addLockerItem()" class="w-full py-3 bg-amber-800 text-amber-50 rounded-2xl text-xs font-bold shadow active:scale-95 transition">
              + ${lang === 'zh' ? '存入闪念包裹' : 'Deposit Thought'}
            </button>
          </div>
        `;
      } else if (currentTab === 'mystery') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">❓ ${lang === 'zh' ? '问答施工箱' : 'Mystery Box'}</h2>
            <div class="space-y-3">
              ${appData.mysteryBox.map(m => `
                <div class="floor-section p-4 rounded-2xl space-y-2">
                  <p class="text-xs font-black text-amber-900">Q: ${lang === 'zh' ? m.q_zh : m.q_en}</p>
                  ${m.isSolved ? `
                    <div class="p-3 bg-emerald-50 border border-emerald-300 rounded-xl text-xs text-emerald-900 font-semibold">
                      <strong>A:</strong> ${lang === 'zh' ? m.a_zh : m.a_en}
                    </div>
                  ` : `
                    <button onclick="solveMystery('${m.id}')" class="text-xs bg-amber-200 text-amber-900 px-3 py-1.5 rounded-lg font-bold">${lang === 'zh' ? '解答并转化为金砖 →' : 'Solve →'}</button>
                  `}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentTab === 'garden') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">🌿 ${lang === 'zh' ? '身份愿景花园' : 'Personal Garden'}</h2>
            <div class="bg-gradient-to-br from-amber-800 to-amber-950 p-6 rounded-3xl text-amber-50 space-y-5 shadow-2xl">
              <div>
                <span class="text-xs font-black opacity-75 uppercase tracking-wider">${lang === 'zh' ? '当前身份' : 'Who You Are'}</span>
                <p class="font-extrabold text-base mt-1">${lang === 'zh' ? appData.garden.who_zh : appData.garden.who_en}</p>
              </div>
              <div class="border-t border-amber-700/50 pt-4">
                <span class="text-xs font-black opacity-75 uppercase tracking-wider">${lang === 'zh' ? '未来的我' : 'Future Self'}</span>
                <p class="font-extrabold text-base mt-1">${lang === 'zh' ? appData.garden.future_zh : appData.garden.future_en}</p>
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'archive') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-950">🗺️ ${lang === 'zh' ? '全景地图' : 'Master Archive'}</h2>
            <div class="grid grid-cols-2 gap-3">
              <div class="floor-section p-4 rounded-2xl text-center">
                <div class="text-3xl font-black text-amber-800">${appData.towers.length}</div>
                <div class="text-xs text-amber-900/70 mt-1 font-bold">${lang === 'zh' ? '已建大楼' : 'Total Towers'}</div>
              </div>
              <div class="floor-section p-4 rounded-2xl text-center">
                <div class="text-3xl font-black text-amber-600">${appData.mysteryBox.filter(m => m.isSolved).length}</div>
                <div class="text-xs text-amber-900/70 mt-1 font-bold">${lang === 'zh' ? '已攻克困惑' : 'Solved Mysteries'}</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function openTower(id) {
      selectedTowerId = id;
      currentTab = 'tower_detail';
      render();
    }

    function deleteFloor(towerId, floorId) {
      if (confirm(lang === 'zh' ? '确定要拆除这个楼层吗？' : 'Are you sure to delete this floor?')) {
        const tower = appData.towers.find(t => t.id === towerId);
        tower.zh.floors = tower.zh.floors.filter(f => f.id !== floorId);
        tower.en.floors = tower.en.floors.filter(f => f.id !== floorId);
        saveData();
        render();
      }
    }

    function addNewFloor(towerId) {
      const title = prompt(lang === 'zh' ? '请输入新楼层房间主题（如：签证与出行）：' : 'Floor title:');
      if (title) {
        const desc = prompt(lang === 'zh' ? '请输入本层的核心理念描述：' : 'Floor description:') || '';
        const tower = appData.towers.find(t => t.id === towerId);
        const newId = Date.now().toString();
        
        tower.zh.floors.unshift({ id: newId, num: tower.zh.floors.length + 1, title, icon: '🪴', desc, items: ['新建规避法则卡片'], fortified: false });
        tower.en.floors.unshift({ id: newId, num: tower.en.floors.length + 1, title, icon: '🪴', desc, items: ['Initial Rule Card'], fortified: false });

        saveData();
        render();
      }
    }

    function fortifyFloor(towerId, floorId) {
      const item = prompt(lang === 'zh' ? '请输入新增的 Checklist 行动细则或税率法则：' : 'New checklist item:');
      if (item) {
        const tower = appData.towers.find(t => t.id === towerId);
        const fZh = tower.zh.floors.find(f => f.id === floorId);
        const fEn = tower.en.floors.find(f => f.id === floorId);

        if (fZh) { fZh.items.push(item); fZh.fortified = true; }
        if (fEn) { fEn.items.push(item); fEn.fortified = true; }

        saveData();
        render();
      }
    }

    function addLockerItem() {
      const input = prompt(lang === 'zh' ? '存入一条闪念/包裹：' : 'Deposit thought:');
      if (input) {
        appData.expressLocker.push({ id: Date.now().toString(), zh: input, en: input });
        saveData();
        render();
      }
    }

    function solveMystery(id) {
      const item = appData.mysteryBox.find(m => m.id === id);
      const ans = prompt(lang === 'zh' ? '请输入解答心得：' : 'Solution:');
      if (ans) {
        item.a_zh = ans; item.a_en = ans; item.isSolved = true;
        saveData();
        render();
      }
    }

    function addNewTower() {
      const name = prompt(lang === 'zh' ? '请输入新大楼名称：' : 'New tower name:');
      if (name) {
        const newId = Date.now().toString();
        appData.towers.push({
          id: newId,
          icon: '🏢',
          version: 'v1.0',
          zh: {
            name: name,
            slogan: '建构清晰认知，掌握日常主动权',
            vision: '持续迭代系统，建立高效秩序',
            footerText: '秩序是自由的保障。',
            floors: [{ id: newId + '_f1', num: 1, title: '基础准则层', icon: '📌', desc: '核心理念与行动基座。', items: ['初始行动规则'], fortified: false }]
          },
          en: {
            name: name,
            slogan: 'Build systems, master habits',
            vision: 'Iterate continuously for peak order',
            footerText: 'Order brings ultimate freedom.',
            floors: [{ id: newId + '_f1', num: 1, title: 'Base Rule Floor', icon: '📌', desc: 'Core concept & base.', items: ['Initial Rule'], fortified: false }]
          }
        });
        saveData();
        openTower(newId);
      }
    }

    render();
  </script>
</body>
</html>
