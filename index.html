<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cognitive District 认知小区</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
    
    body { 
      -webkit-tap-highlight-color: transparent; 
      background-color: #f4efe6; 
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    
    .font-handwritten { font-family: 'Caveat', cursive; }

    /* 经典手绘插画风卡片 */
    .floor-section {
      background: #fefcf8;
      border: 3px solid #78350f;
      box-shadow: 4px 6px 0px #78350f;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-backdrop {
      background-color: rgba(69, 26, 3, 0.4);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="text-amber-950 pb-24 min-h-screen">

  <!-- 顶栏：多用户登录状态 + 语言切换 -->
  <header class="sticky top-0 z-50 bg-[#f4efe6]/95 backdrop-blur-md border-b-2 border-amber-900/20 px-4 py-2.5 flex justify-between items-center shadow-sm">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('towers')">
      <span class="text-2xl">🏡</span>
      <div>
        <h1 class="font-extrabold text-amber-950 text-base leading-none" id="app-title">Cognitive District</h1>
        <div class="flex items-center space-x-1 mt-0.5">
          <span class="text-[10px] font-bold text-amber-800/80" id="user-badge">👤 User: Alex</span>
          <button onclick="openAuthModal()" class="text-[10px] font-bold text-amber-700 underline hover:text-amber-950 ml-1">
            [Switch]
          </button>
        </div>
      </div>
    </div>
    <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1 text-xs font-bold rounded-full bg-amber-200 text-amber-900 border border-amber-400 active:scale-95 transition shadow-sm">
      EN / 中
    </button>
  </header>

  <main class="max-w-md mx-auto p-4" id="main-container">
    <!-- 动态渲染区 -->
  </main>

  <!-- 底部导航栏 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#fefcf8] border-t-2 border-amber-900 py-2 px-3 flex justify-around items-center z-40 max-w-md mx-auto shadow-2xl">
    <button onclick="switchTab('towers')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-800" id="nav-towers">
      <span class="text-xl">🏢</span><span class="nav-label" id="lbl-towers">Towers</span>
    </button>
    <button onclick="switchTab('locker')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-locker">
      <span class="text-xl">📦</span><span class="nav-label" id="lbl-locker">Locker</span>
    </button>
    <button onclick="switchTab('mystery')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-mystery">
      <span class="text-xl">❓</span><span class="nav-label" id="lbl-mystery">Mystery</span>
    </button>
    <button onclick="switchTab('garden')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-garden">
      <span class="text-xl">🌿</span><span class="nav-label" id="lbl-garden">Garden</span>
    </button>
    <button onclick="switchTab('archive')" class="nav-btn flex flex-col items-center text-xs font-bold text-amber-900/40" id="nav-archive">
      <span class="text-xl">🗺️</span><span class="nav-label" id="lbl-archive">Archive</span>
    </button>
  </nav>

  <!-- 用户登录/切换弹窗 -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-[#fefcf8] border-3 border-amber-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-amber-900/20 pb-3">
        <h3 class="font-black text-amber-950 text-lg flex items-center gap-2">
          <span>👤</span> <span id="auth-modal-title">Switch Account / Private Space</span>
        </h3>
        <button onclick="closeAuthModal()" class="text-amber-900 font-bold text-lg hover:text-rose-600">✕</button>
      </div>

      <p class="text-xs text-amber-800 leading-relaxed" id="auth-modal-desc">
        Each account has its own isolated private data space.
      </p>

      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-amber-900 block mb-1" id="lbl-username">Username:</label>
          <input type="text" id="username-input" placeholder="e.g. Alex" class="w-full px-3 py-2 border-2 border-amber-900/30 rounded-xl bg-amber-50 text-amber-950 font-bold focus:outline-none focus:border-amber-800 text-sm">
        </div>

        <button onclick="handleLogin()" class="w-full py-2.5 bg-amber-800 text-amber-50 rounded-xl font-extrabold text-sm border border-amber-950 shadow active:scale-95 transition">
          <span id="btn-login-text">Login / Switch Space</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let lang = localStorage.getItem('cd_lang_v6') || 'en';
    let currentUser = localStorage.getItem('cd_current_user_v6') || 'Alex';
    let currentTab = 'towers';
    let selectedTowerId = 'intl_student';

    // 默认示例数据模版
    const defaultTemplate = {
      towers: [
        {
          id: 'intl_student',
          icon: '🗽',
          version: 'v1.0',
          lockers: [
            { id: 'l1', zh: '已收到 SSN 确认件，保存在安全柜', en: 'SSN confirmation received & secured' },
            { id: 'l2', zh: '缺角大叔 (Trader Joe\'s) 购物清单备忘', en: 'Trader Joe\'s Grocery Checklist Memo' }
          ],
          mysteryBox: [
            { id: 'm1', q_zh: '为什么 Food Truck 不收额外消费税？', a_zh: '因为餐车标价通常已包含税费，即买即吃。', q_en: 'Why no sales tax added at Food Trucks?', a_en: 'Food truck prices usually include sales tax in the total.' }
          ],
          garden: {
            who_zh: '正在建立独立生活规则的国际生',
            who_en: 'Intl student mastering local living rules',
            future_zh: '精明自律、从容驾驭海外生活的自理达人',
            future_en: 'A confident, independent global citizen'
          },
          zh: {
            name: '国际生适应大楼',
            slogan: '搞懂海外生活隐藏规则，避开消费与税收陷阱。',
            vision: '无缝融入留学生活，精细化管理日常花销。',
            floors: [
              {
                id: 'is_f3',
                num: 3,
                title: '消费税规避与避坑指南',
                icon: '🧾',
                desc: '掌握各超市与小摊的税收差异，不做冤大头。',
                items: [
                  '🚚 Food Truck (餐车)：通常标价即终价，无额外加税',
                  '🎯 Target (超市)：未加工原始食物(生鲜/牛奶/面包)免税，但日用品与加工零食加税',
                  '👕 衣物与鞋履税率：单件未满特定额度免税，超过比例不同',
                  '🍎 Appletree (特色超市)：大曲奇饼干、Sandwich Hero 等手工加工品要收税，其余普通未加工杂货不用收税',
                  '🛍️️ Trader Joe\'s (缺角大叔)：需按分类征税，加工食品/饮料/日用品结账时计算消费税'
                ]
              },
              {
                id: 'is_f2',
                num: 2,
                title: '租房与水电网搭建',
                icon: '🛋️️',
                desc: '搞定住所，建立安全的日常生活基底。',
                items: ['确认 Wi-Fi 宽带开通', '办理网银与 SSN/ITIN', '购买租客保险']
              }
            ]
          },
          en: {
            name: 'Intl Student Adaptation Building',
            slogan: 'Master hidden local rules and avoid tax traps.',
            vision: 'Seamless transition to study abroad life.',
            floors: [
              {
                id: 'is_f3',
                num: 3,
                title: 'Sales Tax & Shopping Rules',
                icon: '🧾',
                desc: 'Know tax differences across food trucks, Target, and grocery stores.',
                items: [
                  '🚚 Food Truck: Listed price is usually final price without extra added tax',
                  '🎯 Target: Unprocessed raw groceries exempt; household items & snacks taxable',
                  '👕 Clothing Tax: Rates vary by total item price threshold',
                  '🍎 Appletree Market: Giant cookies & Sandwich Hero (prepared items) are taxed; raw groceries exempt',
                  '🛍️ Trader Joe\'s: Sales tax calculated at checkout for prepared food & supplies'
                ]
              },
              {
                id: 'is_f2',
                num: 2,
                title: 'Housing & Utilities',
                icon: '🛋️',
                desc: 'Set up apartment, internet, and essential services.',
                items: ['Activate Wi-Fi broadband', 'Setup local bank account', 'Get renters insurance']
              }
            ]
          }
        },
        {
          id: 'health',
          icon: '🏠',
          version: 'v1.2',
          lockers: [
            { id: 'lh1', zh: '补剂补充提醒：维生素D3与鱼油', en: 'Supplement refilled: Vitamin D3 & Fish Oil' }
          ],
          mysteryBox: [
            { id: 'mh1', q_zh: '如何保持每日高效精力？', a_zh: '固定睡眠时间并进行早晨阳光照射。', q_en: 'How to maintain daily high energy?', a_en: 'Maintain fixed sleep schedule and get morning sunlight.' }
          ],
          garden: {
            who_zh: '专注体能与心理健康管理者',
            who_en: 'Health & Energy system manager',
            future_zh: '充沛精力、自律健康的行动者',
            future_en: 'An energetic and disciplined individual'
          },
          zh: {
            name: '健康管理大楼',
            slogan: '细微习惯，构建宏大人生。',
            vision: '成为更健康、更有能量的自己。',
            floors: [
              {
                id: 'h_f2',
                num: 2,
                title: '心态与情绪管理',
                icon: '🧘‍♀️',
                desc: '保持积极，学会调节压力，建立内在稳定性。',
                items: ['正念冥想 10分钟', '每日情绪与感恩记录']
              },
              {
                id: 'h_f1',
                num: 1,
                title: '饮食习惯基座',
                icon: '🥗',
                desc: '营养均衡，控制热量，为身体提供稳定能量。',
                items: ['保证足量蛋白质摄入', '每天饮水满 2000ml']
              }
            ]
          },
          en: {
            name: 'Health Management Building',
            slogan: 'Small habits build a big life.',
            vision: 'Become a healthier, more energetic self.',
            floors: [
              {
                id: 'h_f2',
                num: 2,
                title: 'Mindset & Emotion',
                icon: '🧘‍♀️',
                desc: 'Stay positive, regulate stress, build stability.',
                items: ['Mindfulness Meditation 10 mins', 'Daily Journaling']
              },
              {
                id: 'h_f1',
                num: 1,
                title: 'Diet System Base',
                icon: '🥗',
                desc: 'Balanced nutrition and steady energy.',
                items: ['Sufficient Protein Intake', '2000ml Water Daily']
              }
            ]
          }
        }
      ]
    };

    // 读取特定用户的数据
    function loadUserData(username) {
      const key = `cd_app_data_v6_${username.toLowerCase()}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        return JSON.parse(saved);
      } else {
        const newData = JSON.parse(JSON.stringify(defaultTemplate));
        localStorage.setItem(key, JSON.stringify(newData));
        return newData;
      }
    }

    let appData = loadUserData(currentUser);

    function saveData() {
      const key = `cd_app_data_v6_${currentUser.toLowerCase()}`;
      localStorage.setItem(key, JSON.stringify(appData));
      localStorage.setItem('cd_current_user_v6', currentUser);
      localStorage.setItem('cd_lang_v6', lang);
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'zh' : 'en';
      saveData();
      render();
    }

    function switchTab(tab, towerId = null) {
      currentTab = tab;
      if (towerId) selectedTowerId = towerId;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-800');
        btn.classList.add('text-amber-900/40');
      });
      const activeTabId = (tab === 'tower_detail') ? 'towers' : tab;
      const activeNav = document.getElementById(`nav-${activeTabId}`);
      if (activeNav) {
        activeNav.classList.remove('text-amber-900/40');
        activeNav.classList.add('text-amber-800');
      }
      render();
    }

    function render() {
      document.getElementById('lbl-towers').innerText = lang === 'zh' ? '大楼' : 'Towers';
      document.getElementById('lbl-locker').innerText = lang === 'zh' ? '快递柜' : 'Locker';
      document.getElementById('lbl-mystery').innerText = lang === 'zh' ? '问答箱' : 'Mystery';
      document.getElementById('lbl-garden').innerText = lang === 'zh' ? '花园' : 'Garden';
      document.getElementById('lbl-archive').innerText = lang === 'zh' ? '全景' : 'Archive';
      document.getElementById('app-title').innerText = lang === 'zh' ? '认知小区' : 'Cognitive District';
      document.getElementById('user-badge').innerText = `👤 ${currentUser}`;

      const container = document.getElementById('main-container');

      // 选中的当前大楼
      let activeTower = appData.towers.find(t => t.id === selectedTowerId);
      if (!activeTower && appData.towers.length > 0) {
        activeTower = appData.towers[0];
        selectedTowerId = activeTower.id;
      }

      // 页面 1：大楼列表 (Towers)
      if (currentTab === 'towers') {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xs font-black text-amber-900/60 uppercase tracking-widest flex justify-between items-center">
              <span>${lang === 'zh' ? '我的建筑群' : 'My Dollhouses'}</span>
              <span class="text-[10px] text-amber-800/80">${lang === 'zh' ? '点击大楼进入内部' : 'Click to inspect'}</span>
            </h2>

            ${appData.towers.map(t => {
              const data = t[lang];
              return `
                <div class="floor-section p-5 rounded-2xl flex items-center justify-between hover:bg-amber-50 relative">
                  <div class="flex items-center space-x-4 cursor-pointer flex-1" onclick="openTower('${t.id}')">
                    <span class="text-4xl">${t.icon}</span>
                    <div>
                      <h3 class="font-black text-amber-950 text-base flex items-center gap-2">
                        ${data.name} 
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900">${t.version}</span>
                      </h3>
                      <p class="text-xs text-amber-800/70 mt-1">${data.floors.length}${lang === 'zh' ? '层房间' : 'Floors'}</p>
                    </div>
                  </div>
                  
                  <div class="flex items-center space-x-2">
                    <button onclick="deleteTower(event, '${t.id}')" class="text-xs text-rose-700 bg-rose-100 hover:bg-rose-200 px-2.5 py-1 rounded-lg font-bold border border-rose-300">
                      🗑️ ${lang === 'zh' ? '拆除' : 'Delete'}
                    </button>
                    <span onclick="openTower('${t.id}')" class="text-amber-900 font-extrabold text-xl cursor-pointer">➔</span>
                  </div>
                </div>
              `;
            }).join('')}

            <button onclick="addNewTower()" class="w-full py-4 border-2 border-dashed border-amber-800/40 text-amber-900 rounded-2xl font-black text-sm flex items-center justify-center space-x-2 bg-amber-100/50 active:bg-amber-200 transition">
              <span class="text-xl">+</span>
              <span>${lang === 'zh' ? '设计新大楼' : 'Design New Building'}</span>
            </button>
          </div>
        `;
      } 
      // 页面 2：大楼内部视图 (Tower Detail)
      else if (currentTab === 'tower_detail') {
        if (!activeTower) { switchTab('towers'); return; }
        const data = activeTower[lang];

        container.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-4">
              <button onclick="switchTab('towers')" class="text-xs text-amber-900 font-bold bg-amber-200/80 px-3 py-1.5 rounded-xl border border-amber-800/30">
                ← ${lang === 'zh' ? '返回建筑群' : 'District Map'}
              </button>
              <button onclick="addNewFloor('${activeTower.id}')" class="text-xs bg-amber-800 text-amber-50 font-bold px-3 py-1.5 rounded-xl border border-amber-950 shadow">
                + ${lang === 'zh' ? '加盖顶楼新层' : 'Build Floor'}
              </button>
            </div>

            <div class="bg-amber-100 border-3 border-amber-900 p-5 rounded-3xl mb-5 text-center relative shadow-md">
              <div class="font-handwritten text-2xl text-amber-900 font-bold">${data.slogan}</div>
              <h2 class="text-2xl font-black text-amber-950 mt-1">${data.name}</h2>
              <p class="text-xs text-amber-900 mt-2 font-bold bg-amber-200/60 py-1 px-3 rounded-lg inline-block">
                🎯 ${lang === 'zh' ? '愿景' : 'Vision'}: ${data.vision}
              </p>
            </div>

            <div class="space-y-4">
              ${data.floors.map((f, idx) => `
                <div class="floor-section rounded-2xl p-4 relative">
                  <div class="flex justify-between items-center border-b border-amber-900/10 pb-2 mb-3">
                    <div class="flex items-center space-x-2">
                      <span class="text-2xl">${f.icon || '🏠'}</span>
                      <h3 class="font-black text-amber-950 text-base">${f.num}.${f.title}</h3>
                    </div>
                    <div class="flex items-center space-x-1.5">
                      <button onclick="editFloorHeader('${activeTower.id}', '${f.id}')" class="text-[10px] text-amber-900 bg-amber-200 hover:bg-amber-300 px-2 py-0.5 rounded font-bold border border-amber-400">
                        ✏️ ${lang === 'zh' ? '编辑' : 'Edit'}
                      </button>
                      <button onclick="deleteFloor('${activeTower.id}', '${f.id}')" class="text-[10px] text-rose-700 bg-rose-100 hover:bg-rose-200 px-2 py-0.5 rounded font-bold border border-rose-300">
                        🗑 ${lang === 'zh' ? '删除' : 'Del'}
                      </button>
                    </div>
                  </div>

                  <div class="space-y-2">
                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-900/10">
                      <p class="text-xs text-amber-900 font-medium leading-relaxed">${f.desc}</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-amber-900/20 space-y-2">
                      <span class="text-[10px] font-black text-amber-800 uppercase tracking-wider block">${lang === 'zh' ? '清单 / 细则卡片' : 'Checklist Items'}:</span>
                      ${f.items.map((item, itemIdx) => `
                        <div class="flex items-center justify-between text-xs text-amber-950 font-semibold bg-amber-50/50 p-1.5 rounded-lg border border-amber-900/10">
                          <div class="flex items-start space-x-2 flex-1 mr-2">
                            <span class="text-amber-600 font-bold mt-0.5">✓</span>
                            <span>${item}</span>
                          </div>
                          <div class="flex items-center space-x-1">
                            <button onclick="editItem('${activeTower.id}', '${f.id}', ${itemIdx})" class="text-[10px] text-amber-800 bg-amber-200/80 px-1.5 py-0.5 rounded font-bold">✏️</button>
                            <button onclick="deleteItem('${activeTower.id}', '${f.id}', ${itemIdx})" class="text-[10px] text-rose-700 bg-rose-100 px-1.5 py-0.5 rounded font-bold">🗑️</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <button onclick="addItemToFloor('${activeTower.id}', '${f.id}')" class="w-full mt-3 py-2 text-xs bg-amber-100 hover:bg-amber-200 text-amber-950 font-black rounded-xl border border-amber-900/30 transition">
                    🧱 ${lang === 'zh' ? '+ 新增贴砖 / 细则' : '+ Add Item Card'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } 
      // 页面 3：快递柜 (Locker - 绑定大楼)
      else if (currentTab === 'locker') {
        if (!activeTower) { container.innerHTML = `<div class="p-4 text-center font-bold text-amber-900">No building found.</div>`; return; }
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-amber-100 p-4 rounded-2xl border-2 border-amber-900 flex justify-between items-center">
              <div>
                <span class="text-xs text-amber-800 font-bold block">${lang === 'zh' ? '大楼专属快递柜' : 'Tower Express Locker'}</span>
                <h3 class="text-lg font-black text-amber-950">${activeTower.icon} ${activeTower[lang].name}</h3>
              </div>
              <button onclick="addLockerItem('${activeTower.id}')" class="text-xs bg-amber-800 text-white font-bold px-3 py-1.5 rounded-xl border border-amber-950 shadow">
                + ${lang === 'zh' ? '寄存包裹' : 'Store Parcel'}
              </button>
            </div>

            <div class="space-y-2">
              ${(activeTower.lockers || []).map(item => `
                <div class="floor-section p-3 rounded-xl flex justify-between items-center text-xs font-bold text-amber-950">
                  <span>📦 ${item[lang] || item.en}</span>
                  <button onclick="deleteLockerItem('${activeTower.id}', '${item.id}')" class="text-rose-700 bg-rose-100 px-2 py-1 rounded font-bold border border-rose-300">
                    🗑️ ${lang === 'zh' ? '取出/删除' : 'Retrieve'}
                  </button>
                </div>
              `).join('')}
              {(!activeTower.lockers || activeTower.lockers.length === 0) ? `<p class="text-xs text-center text-amber-800/60 py-4">${lang === 'zh' ? '柜子是空的' : 'Locker is empty'}</p>` : ''}
            </div>
          </div>
        `;
      } 
      // 页面 4：问答箱 (Mystery Box - 绑定大楼)
      else if (currentTab === 'mystery') {
        if (!activeTower) return;
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-amber-100 p-4 rounded-2xl border-2 border-amber-900">
              <span class="text-xs text-amber-800 font-bold block">${lang === 'zh' ? '大楼知识问答箱' : 'Building Mystery Q&A'}</span>
              <h3 class="text-lg font-black text-amber-950">${activeTower.icon} ${activeTower[lang].name}</h3>
            </div>

            <div class="space-y-3">
              ${(activeTower.mysteryBox || []).map(mb => `
                <div class="floor-section p-4 rounded-2xl space-y-2">
                  <div class="flex justify-between items-start">
                    <h4 class="font-black text-xs text-amber-950">❓ ${mb['q_' + lang] || mb.q_en}</h4>
                    <button onclick="deleteMysteryItem('${activeTower.id}', '${mb.id}')" class="text-[10px] text-rose-700 bg-rose-100 px-2 py-0.5 rounded font-bold border border-rose-300">🗑️</button>
                  </div>
                  <p class="text-xs text-amber-900 bg-amber-50 p-2.5 rounded-xl border border-amber-900/10">💡 ${mb['a_' + lang] || mb.a_en}</p>
                </div>
              `).join('')}
            </div>

            <button onclick="addMysteryItem('${activeTower.id}')" class="w-full py-3 border-2 border-dashed border-amber-800/40 text-amber-900 rounded-xl font-bold text-xs bg-amber-100/50">
              + ${lang === 'zh' ? '放入新疑问卡片' : 'Add New Q&A Card'}
            </button>
          </div>
        `;
      } 
      // 页面 5：花园 (Garden - 绑定大楼)
      else if (currentTab === 'garden') {
        if (!activeTower) return;
        const g = activeTower.garden || {};
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-amber-100 p-4 rounded-2xl border-2 border-amber-900">
              <span class="text-xs text-amber-800 font-bold block">${lang === 'zh' ? '大楼角色花园' : 'Tower Persona Garden'}</span>
              <h3 class="text-lg font-black text-amber-950">${activeTower.icon} ${activeTower[lang].name}</h3>
            </div>

            <div class="floor-section p-5 rounded-2xl space-y-4">
              <div>
                <span class="text-[10px] font-black text-amber-800 uppercase tracking-widest block">${lang === 'zh' ? '我是谁 (Who I Am)' : 'Current Persona'}:</span>
                <p class="text-sm font-bold text-amber-950 mt-1">${g['who_' + lang] || g.who_en || 'Self-governing student'}</p>
              </div>
              <div class="border-t border-amber-900/10 pt-3">
                <span class="text-[10px] font-black text-amber-800 uppercase tracking-widest block">${lang === 'zh' ? '走向的未来 (Future Vision)' : 'Future Self'}:</span>
                <p class="text-sm font-bold text-amber-950 mt-1">${g['future_' + lang] || g.future_en || 'Independent master'}</p>
              </div>
              <button onclick="editGarden('${activeTower.id}')" class="w-full py-2 bg-amber-800 text-amber-50 font-bold text-xs rounded-xl border border-amber-950 shadow">
                ✏️ ${lang === 'zh' ? '修改本大楼角色形象' : 'Edit Persona'}
              </button>
            </div>
          </div>
        `;
      } 
      // 页面 6：全景归档 (Archive)
      else if (currentTab === 'archive') {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-amber-100 p-4 rounded-2xl border-2 border-amber-900">
              <h3 class="text-lg font-black text-amber-950">🗺️ ${lang === 'zh' ? '小区全景概览' : 'District Overview'}</h3>
              <p class="text-xs text-amber-800 font-bold">${lang === 'zh' ? '当前工作区账号' : 'Active Account'}: ${currentUser}</p>
            </div>

            <div class="floor-section p-4 rounded-2xl space-y-3">
              <div class="flex justify-between items-center text-xs font-bold text-amber-950">
                <span>🏢 ${lang === 'zh' ? '大楼总数' : 'Total Buildings'}:</span>
                <span class="text-amber-800 font-black text-base">${appData.towers.length}</span>
              </div>
              <div class="flex justify-between items-center text-xs font-bold text-amber-950 border-t border-amber-900/10 pt-2">
                <span>📦 ${lang === 'zh' ? '快递柜包裹总数' : 'Total Locker Items'}:</span>
                <span class="text-amber-800 font-black text-base">${appData.towers.reduce((acc, t) => acc + (t.lockers ? t.lockers.length : 0), 0)}</span>
              </div>
            </div>
          </div>
        `;
      }
    }

    // 交互逻辑函数：
    function openTower(id) {
      selectedTowerId = id;
      currentTab = 'tower_detail';
      render();
    }

    function deleteTower(event, towerId) {
      event.stopPropagation();
      if (confirm(lang === 'zh' ? '确定要拆除整栋大楼吗？拆除后不可恢复！' : 'Delete this entire building?')) {
        appData.towers = appData.towers.filter(t => t.id !== towerId);
        saveData();
        render();
      }
    }

    function deleteFloor(towerId, floorId) {
      if (confirm(lang === 'zh' ? '确定要删除这个楼层吗？' : 'Delete this floor?')) {
        const tower = appData.towers.find(t => t.id === towerId);
        tower.zh.floors = tower.zh.floors.filter(f => f.id !== floorId);
        tower.en.floors = tower.en.floors.filter(f => f.id !== floorId);
        saveData();
        render();
      }
    }

    function editFloorHeader(towerId, floorId) {
      const tower = appData.towers.find(t => t.id === towerId);
      const fZh = tower.zh.floors.find(f => f.id === floorId);
      const fEn = tower.en.floors.find(f => f.id === floorId);

      const newTitle = prompt(lang === 'zh' ? '修改楼层标题：' : 'New floor title:', lang === 'zh' ? fZh.title : fEn.title);
      if (newTitle !== null) {
        const newDesc = prompt(lang === 'zh' ? '修改描述：' : 'New description:', lang === 'zh' ? fZh.desc : fEn.desc) || '';
        if (lang === 'zh') fZh.title = newTitle, fZh.desc = newDesc;
        else fEn.title = newTitle, fEn.desc = newDesc;
        saveData();
        render();
      }
    }

    function deleteItem(towerId, floorId, itemIndex) {
      const tower = appData.towers.find(t => t.id === towerId);
      const fZh = tower.zh.floors.find(f => f.id === floorId);
      const fEn = tower.en.floors.find(f => f.id === floorId);

      if (confirm(lang === 'zh' ? '确定删除该条细则吗？' : 'Delete this item?')) {
        if (fZh && fZh.items) fZh.items.splice(itemIndex, 1);
        if (fEn && fEn.items) fEn.items.splice(itemIndex, 1);
        saveData();
        render();
      }
    }

    function editItem(towerId, floorId, itemIndex) {
      const tower = appData.towers.find(t => t.id === towerId);
      const targetFloor = tower[lang].floors.find(f => f.id === floorId);
      const oldVal = targetFloor.items[itemIndex];

      const newVal = prompt(lang === 'zh' ? '编辑条目内容：' : 'Edit item card:', oldVal);
      if (newVal !== null) {
        const fZh = tower.zh.floors.find(f => f.id === floorId);
        const fEn = tower.en.floors.find(f => f.id === floorId);
        if (fZh) fZh.items[itemIndex] = newVal;
        if (fEn) fEn.items[itemIndex] = newVal;
        saveData();
        render();
      }
    }

    function addItemToFloor(towerId, floorId) {
      const item = prompt(lang === 'zh' ? '请输入新的细则/卡片：' : 'New rule / item card:');
      if (item) {
        const tower = appData.towers.find(t => t.id === towerId);
        const fZh = tower.zh.floors.find(f => f.id === floorId);
        const fEn = tower.en.floors.find(f => f.id === floorId);
        if (fZh) fZh.items.push(item);
        if (fEn) fEn.items.push(item);
        saveData();
        render();
      }
    }

    function addNewFloor(towerId) {
      const title = prompt(lang === 'zh' ? '请输入新楼层名称：' : 'Floor title:');
      if (title) {
        const desc = prompt(lang === 'zh' ? '请输入描述：' : 'Description:') || '';
        const tower = appData.towers.find(t => t.id === towerId);
        const newId = Date.now().toString();
        
        tower.zh.floors.unshift({ id: newId, num: tower.zh.floors.length + 1, title, icon: '🪴', desc, items: ['新法则/细则'] });
        tower.en.floors.unshift({ id: newId, num: tower.en.floors.length + 1, title, icon: '🪴', desc, items: ['New Rule'] });

        saveData();
        render();
      }
    }

    function addNewTower() {
      const name = prompt(lang === 'zh' ? '请输入新大楼名称：' : 'New tower name:');
      if (name) {
        const newId = Date.now().toString();
        appData.towers.push({
          id: newId,
          icon: '🏢',
          version: 'v1.0',
          lockers: [],
          mysteryBox: [],
          garden: { who_zh: '新角色', who_en: 'New Persona', future_zh: '目标状态', future_en: 'Goal State' },
          zh: {
            name: name,
            slogan: '建构清晰认知，掌握日常主动权',
            vision: '持续迭代系统，建立高效秩序',
            floors: [{ id: newId + '_f1', num: 1, title: '基础准则层', icon: '📌', desc: '核心理念与行动基座。', items: ['初始规则'] }]
          },
          en: {
            name: name,
            slogan: 'Build systems, master habits',
            vision: 'Iterate continuously for peak order',
            floors: [{ id: newId + '_f1', num: 1, title: 'Base Rule Floor', icon: '📌', desc: 'Core concept & base.', items: ['Initial Rule'] }]
          }
        });
        saveData();
        openTower(newId);
      }
    }

    // 快递/问答/花园等联动函数
    function addLockerItem(towerId) {
      const txt = prompt(lang === 'zh' ? '请输入存入快递柜的信息：' : 'Enter locker item:');
      if (txt) {
        const tower = appData.towers.find(t => t.id === towerId);
        if (!tower.lockers) tower.lockers = [];
        tower.lockers.push({ id: Date.now().toString(), zh: txt, en: txt });
        saveData();
        render();
      }
    }

    function deleteLockerItem(towerId, itemId) {
      const tower = appData.towers.find(t => t.id === towerId);
      tower.lockers = tower.lockers.filter(i => i.id !== itemId);
      saveData();
      render();
    }

    function addMysteryItem(towerId) {
      const q = prompt(lang === 'zh' ? '输入问题：' : 'Question:');
      if (q) {
        const a = prompt(lang === 'zh' ? '输入答案：' : 'Answer:') || '';
        const tower = appData.towers.find(t => t.id === towerId);
        if (!tower.mysteryBox) tower.mysteryBox = [];
        tower.mysteryBox.push({ id: Date.now().toString(), q_zh: q, a_zh: a, q_en: q, a_en: a });
        saveData();
        render();
      }
    }

    function deleteMysteryItem(towerId, itemId) {
      const tower = appData.towers.find(t => t.id === towerId);
      tower.mysteryBox = tower.mysteryBox.filter(i => i.id !== itemId);
      saveData();
      render();
    }

    function editGarden(towerId) {
      const tower = appData.towers.find(t => t.id === towerId);
      if (!tower.garden) tower.garden = {};
      const who = prompt(lang === 'zh' ? '我是谁 (Who I Am)：' : 'Who I am:', tower.garden['who_' + lang] || '');
      if (who !== null) {
        const future = prompt(lang === 'zh' ? '走向的未来 (Future Vision)：' : 'Future vision:', tower.garden['future_' + lang] || '');
        tower.garden['who_' + lang] = who;
        tower.garden['future_' + lang] = future;
        saveData();
        render();
      }
    }

    // 用户登录弹窗函数
    function openAuthModal() {
      document.getElementById('username-input').value = currentUser;
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function handleLogin() {
      const input = document.getElementById('username-input').value.trim();
      if (input) {
        currentUser = input;
        appData = loadUserData(currentUser);
        saveData();
        closeAuthModal();
        render();
      }
    }

    // 初始化渲染
    render();
  </script>
</body>
</html>
